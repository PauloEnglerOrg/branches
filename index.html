<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Branches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E3E6E9; --dot:#BFC5CB; --card:#FBFCFC; --ink:#1B2025; --muted:#66707A; --line:#D0D5DA;
  --accent:#2E57E6; --warn:#CF3429; --soon:#A86A12; --panel:#F5F6F7; --hover:#E9ECEF; --guide:#E0356E;
  --shadow:0 1px 0 rgba(27,32,37,.05),0 8px 20px -10px rgba(27,32,37,.35);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14171A; --dot:#2A3036; --card:#1F2328; --ink:#E6E9EC; --muted:#8C96A0; --line:#31373E;
    --accent:#809DFF; --warn:#FF6A5C; --soon:#E2A94B; --panel:#1A1D21; --hover:#262B31; --guide:#FF5C93;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -10px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14171A; --dot:#2A3036; --card:#1F2328; --ink:#E6E9EC; --muted:#8C96A0; --line:#31373E;
  --accent:#809DFF; --warn:#FF6A5C; --soon:#E2A94B; --panel:#1A1D21; --hover:#262B31; --guide:#FF5C93;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);overflow:hidden;
  font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{position:relative;height:100%;overflow:hidden}
#canvas{position:absolute;inset:0;touch-action:none;cursor:default;
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px)}
#canvas.spacepan{cursor:grab}
#canvas.panning{cursor:grabbing}
#marquee{position:absolute;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:2px;pointer-events:none;z-index:4}
#marquee[hidden]{display:none}
#canvas.attaching,#canvas.attaching .node{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke-width:2.2;stroke-linecap:round}
#edges path.done{stroke-dasharray:3 6;opacity:.55}
#edges circle{stroke:none}
#guides{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#guides path{fill:none;stroke:var(--guide)}

/* Cards */
.node{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);padding:9px 12px 10px;min-width:120px;width:max-content;user-select:none;-webkit-user-select:none;cursor:default}
.node .head{display:flex;gap:9px;align-items:flex-start}
.node .title{white-space:pre-wrap;overflow-wrap:anywhere;flex:1}
.node .ph{color:var(--muted);font-style:italic}
.node.sel{outline:2px solid var(--c);outline-offset:3px;z-index:3}
.node.s1{max-width:220px}.node.s1 .title{font-size:13px;line-height:1.3;font-weight:500}
.node.s2{max-width:260px}.node.s2 .title{font-size:16px;line-height:1.3;font-weight:500}
.node.s3{max-width:320px;padding:12px 16px 13px}.node.s3 .title{font-size:24px;line-height:1.15;font-weight:600;letter-spacing:-.01em}
.node.s4{max-width:440px;padding:14px 20px 16px}.node.s4 .title{font-size:38px;line-height:1.02;font-weight:700;letter-spacing:-.025em}
.node.root{background:var(--c);border-color:transparent;color:#fff;border-radius:14px}
.node.root .ph{color:rgba(255,255,255,.75)}
.node.done .title{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.node.done{opacity:.72}
.addh{position:absolute;width:24px;height:24px;border-radius:50%;border:2px solid var(--paper);background:var(--c);color:#fff;padding:0;
  font-size:17px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:1}
.addh:hover{filter:brightness(1.12)}
.addh.r{left:100%;top:50%;margin:-12px 0 0 22px}.addh.l{right:100%;top:50%;margin:-12px 22px 0 0}
.addh.b{top:100%;left:50%;margin:22px 0 0 -12px}.addh.t{bottom:100%;left:50%;margin:0 0 22px -12px}
.fold{position:absolute;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--c);background:var(--card);color:var(--c);padding:0;
  font-size:14px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2}
.fold:hover{transform:scale(1.2)}
.rsz{position:absolute;right:-6px;bottom:-6px;width:11px;height:11px;border-radius:3px;background:var(--card);border:1.5px solid var(--c);cursor:nwse-resize;z-index:2;touch-action:none}
.rsz::after{content:"";position:absolute;inset:-9px}
.fold.r{left:100%;top:50%;margin:-9px 0 0 -9px}.fold.l{right:100%;top:50%;margin:-9px -9px 0 0}
.fold.b{top:100%;left:50%;margin:-9px 0 0 -9px}.fold.t{bottom:100%;left:50%;margin:0 0 -9px -9px}
.node .title[contenteditable]{user-select:text;-webkit-user-select:text;cursor:text;outline:none;min-width:2ch}
.node .title[contenteditable]:empty::before{content:"Untitled";color:var(--muted);font-style:italic}
.node.root .title[contenteditable]:empty::before{color:rgba(255,255,255,.75)}

.chk{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:2px solid var(--c);background:transparent;padding:0;position:relative}
.node.s3 .chk{margin-top:5px}.node.s4 .chk{margin-top:10px;width:22px;height:22px}
.node.done .chk{background:var(--c)}
.node.done .chk::after,.ichk.on::after,.pchk.on::after{content:"";position:absolute;left:50%;top:45%;width:35%;height:60%;
  border:solid #fff;border-width:0 2px 2px 0;transform:translate(-50%,-50%) rotate(45deg)}
.items{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:13px;line-height:1.3}
.items li{display:flex;gap:7px;align-items:flex-start}
.items li.done span{text-decoration:line-through;color:var(--muted)}
.ichk{flex:none;width:13px;height:13px;margin-top:2px;border-radius:3px;border:1.5px solid var(--c);background:transparent;padding:0;position:relative}
.ichk.on{background:var(--c)}
.ichk.on::after{border-width:0 1.5px 1.5px 0}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:8px;font-size:12px}
.due{padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.due.today{border-color:var(--soon);color:var(--soon)}
.due.over{background:var(--warn);border-color:var(--warn);color:#fff}
.node.done .due{background:none;border-color:var(--line);color:var(--muted)}
.prog{color:var(--muted)}
.root .prog{color:rgba(255,255,255,.85)}
.root .due{border-color:rgba(255,255,255,.5);color:#fff}
.lnk{color:var(--accent);text-decoration:underline;text-underline-offset:2px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.root .lnk{color:#fff}

/* Chrome */
.bar{position:absolute;display:flex;align-items:center;gap:4px;padding:5px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:5}
#topleft{top:12px;left:12px}
#topright{top:12px;right:12px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.02em;padding:0 8px 0 6px}
.btn{height:32px;min-width:32px;padding:0 10px;border:0;border-radius:8px;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-size:14px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{opacity:.88;background:var(--ink)}
.btn.danger{color:var(--warn)}
.sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.seg{display:inline-flex;background:var(--hover);border-radius:8px;padding:2px}
.seg button{height:28px;padding:0 9px;border:0;border-radius:6px;background:transparent;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--warn);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.badge[hidden]{display:none}
#zoomlbl{font-size:12px;color:var(--muted);min-width:40px}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sdot.ok{background:#16825A}.sdot.saving,.sdot.loading{background:var(--soon)}.sdot.error{background:var(--warn)}
.btn[hidden]{display:none}

#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--muted);font-size:18px;text-align:center;padding:24px}
#empty[hidden]{display:none}

/* Side panel */
.sheet{position:absolute;top:64px;right:12px;bottom:12px;width:340px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);z-index:6;display:flex;flex-direction:column;overflow:hidden}
.sheet[hidden]{display:none}
.sheet .body{overflow:auto;padding:14px 16px 18px;display:grid;gap:18px}
.sheet .top{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 0 16px;color:var(--muted);font-size:13px}
.field{display:grid;gap:7px}
.field > label,.fl{font-size:13px;color:var(--muted)}
#pTitle{width:100%;resize:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:18px;font-weight:600;line-height:1.25;min-height:48px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp{height:34px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:0 10px;font-size:14px;min-width:0}
.inp.grow{flex:1}
.sw{width:24px;height:24px;border-radius:50%;border:0;background:var(--s);padding:0}
.sw.on{outline:2px solid var(--ink);outline-offset:2px}
.plist{display:grid;gap:4px}
.pitem{display:flex;gap:8px;align-items:center}
.pitem .inp{flex:1;height:32px;border-color:transparent;background:transparent;padding:0 6px}
.pitem .inp:hover,.pitem .inp:focus{border-color:var(--line);background:var(--card)}
.pchk{flex:none;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--muted);background:transparent;padding:0;position:relative}
.pchk.on{background:var(--ink);border-color:var(--ink)}
.pchk.on::after{border-color:var(--paper)}
.x{flex:none;width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:18px;line-height:1}
.x:hover{background:var(--hover);color:var(--ink)}
.hint{font-size:12px;color:var(--muted);line-height:1.45}
kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--card)}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.actions .btn{border:1px solid var(--line);background:var(--card)}

/* Due list */
#duelist .grp{display:grid;gap:4px}
#duelist .grp h3{margin:0 0 2px;font-size:13px;font-weight:500;color:var(--muted)}
.drow{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:var(--card);border-radius:8px;padding:9px 10px;border-left:4px solid var(--c)}
.drow:hover{background:var(--hover)}
.drow .t{flex:1;font-size:14px}
.drow .d{font-size:12px;color:var(--muted);white-space:nowrap}
.drow.over .d{color:var(--warn)}

/* Modal */
#modal{position:absolute;inset:0;background:rgba(10,12,14,.45);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
#modal[hidden]{display:none}
#modal .box{background:var(--panel);border-radius:14px;padding:18px;width:min(520px,100%);display:grid;gap:12px;max-height:100%;overflow:auto}
#modal h2{margin:0;font-size:20px;letter-spacing:-.01em}
#modal h3{margin:6px 0 0;font-size:15px;font-weight:600}
#syncBox,#presyncBox{display:grid;gap:8px}
#presyncBox[hidden],#syncSec[hidden]{display:none}
#modal textarea{width:100%;height:120px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px;font-size:12px;resize:vertical}

#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:10px;padding:9px 10px 9px 14px;
  display:flex;gap:10px;align-items:center;font-size:14px;z-index:10;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
#toast[hidden]{display:none}
#toast button{border:0;background:rgba(255,255,255,.14);color:inherit;border-radius:6px;padding:4px 10px}

@media (max-width:720px){
  .sheet{top:auto;left:0;right:0;bottom:0;width:auto;max-height:58%;border-radius:16px 16px 0 0}
  #topright{top:60px;left:12px;right:12px;overflow-x:auto;scrollbar-width:none}
  .hide-sm{display:none}
  #toast{bottom:auto;top:108px}
}
</style>
</head>
<body>
<div id="app">
  <div id="canvas">
    <div id="world">
      <svg id="edges"></svg>
      <div id="nodes"></div>
      <svg id="guides"></svg>
    </div>
  </div>
  <div id="marquee" hidden></div>
  <div id="empty" hidden>Double-click anywhere, or use New subject, to start a branch.</div>

  <div class="bar" id="topleft">
    <span class="brand">Branches</span>
    <button class="btn primary" id="bNew">New subject</button>
  </div>

  <div class="bar" id="topright">
    <button class="btn" id="bDue">Due <span class="badge" id="dueBadge" hidden>0</span></button>
    <span class="sep"></span>
    <span class="fl hide-sm" style="padding-left:4px">Drag moves</span>
    <div class="seg" id="moveSeg">
      <button data-m="branch" class="on">Branch</button><button data-m="card">Card</button>
    </div>
    <span class="sep"></span>
    <button class="btn" id="bOut" aria-label="Zoom out">−</button>
    <span id="zoomlbl">100%</span>
    <button class="btn" id="bIn" aria-label="Zoom in">+</button>
    <button class="btn" id="bFit">Fit</button>
    <span class="sep"></span>
    <button class="btn" id="bSync" hidden><span class="sdot" id="syncDot"></span><span id="syncLbl">Sync</span></button>
    <button class="btn" id="bBackup">Backup</button>
  </div>

  <aside class="sheet" id="panel" hidden></aside>
  <aside class="sheet" id="duelist" hidden></aside>

  <div id="modal" hidden>
    <div class="box">
      <div id="syncSec" hidden>
        <h2>Sync</h2>
        <div id="syncBox"></div>
        <div id="presyncBox" hidden>
          <p class="hint" style="margin:0">This device had a different board before you signed in. It was kept aside in case you need it.</p>
          <div class="row"><button class="btn" id="bkPresync" style="border:1px solid var(--line)">Replace synced board with it</button><button class="btn" id="bkPresyncDrop">Discard it</button></div>
        </div>
      </div>
      <h2>Backup</h2>
      <p class="hint" style="margin:0">Copy the backup below and keep it somewhere safe, or paste a backup to replace this board.</p>
      <textarea id="bkOut" readonly></textarea>
      <div class="row"><button class="btn primary" id="bkCopy">Copy backup</button></div>
      <textarea id="bkIn" placeholder="Paste a backup here"></textarea>
      <div class="row">
        <button class="btn" id="bkLoad" style="border:1px solid var(--line)">Replace board with backup</button>
        <span style="flex:1"></span>
        <button class="btn" id="bkClose">Close</button>
      </div>
    </div>
  </div>

  <div id="toast" hidden><span id="toastMsg"></span><button id="toastAct" hidden></button></div>
</div>

<script>
(() => {
const COLORS=['#2E57E6','#CF3429','#16825A','#B26B0E','#7440D0','#0E8398','#C0327F','#4A5462'];
const KEY='branches.v1';
/* Firebase web config (public by design; the Firestore rules keep each board private). null = sync off */
const FIREBASE_CONFIG={
  apiKey:'AIzaSyCfUtnyeITPz98iVj4E9deEwOYhTHdNfOI',
  authDomain:'branches-f3238.firebaseapp.com',
  projectId:'branches-f3238',
  storageBucket:'branches-f3238.firebasestorage.app',
  messagingSenderId:'522153718678',
  appId:'1:522153718678:web:05ce4e50f6527591b163b7'
};
const $=s=>document.querySelector(s);
const canvas=$('#canvas'), world=$('#world'), edges=$('#edges'), nodesEl=$('#nodes');
const panel=$('#panel'), duelist=$('#duelist');
let S={nodes:{},view:{x:0,y:0,k:1}};
let sel=null, msel=new Set(), moveMode='branch', attachFrom=null, elMap={};

const uid=()=>Math.random().toString(36).slice(2,10);
const N=id=>S.nodes[id];
const all=()=>Object.values(S.nodes);
const kids=id=>all().filter(n=>n.parent===id);
function hiddenNode(id){let n=N(id),guard=0;while(n&&n.parent&&guard++<999){n=N(n.parent);if(n&&n.collapsed)return true}return false}
const visible=()=>all().filter(n=>!hiddenNode(n.id));
function reveal(id){let n=N(id),guard=0;while(n&&n.parent&&guard++<999){n=N(n.parent);if(n)delete n.collapsed}}
function desc(id){const out=[],st=[id];while(st.length){const c=st.pop();for(const k of kids(c)){out.push(k.id);st.push(k.id)}}return out}
function rootOf(id){let n=N(id),guard=0;while(n&&n.parent&&N(n.parent)&&guard++<999)n=N(n.parent);return n}
const colorOf=id=>(rootOf(id)&&rootOf(id).color)||COLORS[0];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeUrl(u){u=(u||'').trim();if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;return /^(https?|mailto):/i.test(u)?u:'#'}
function host(u){try{return new URL(safeUrl(u)).hostname.replace(/^www\./,'')||u}catch(e){return u}}

/* ---------- storage ---------- */
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.nodes){S=d;S.view=S.view||{x:0,y:0,k:1};return true}}}catch(e){}return false}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},200);queuePush()}

/* ---------- dates ---------- */
function parseDue(d){if(!d)return null;const [ds,ts]=d.split('T');const [y,m,dd]=ds.split('-').map(Number);if(!y)return null;
  let h=0,mi=0;if(ts){[h,mi]=ts.split(':').map(Number)}return new Date(y,m-1,dd,h||0,mi||0)}
function dueInfo(d){const t=parseDue(d);if(!t||isNaN(t))return null;const hasTime=d.includes('T');
  const now=new Date(),sod=new Date(now.getFullYear(),now.getMonth(),now.getDate()),tom=new Date(sod.getTime()+864e5);
  let cls='later';if(hasTime?t<now:t<sod)cls='over';else if(t<tom)cls='today';
  const day=(t>=sod&&t<tom)?'Today':(t>=tom&&t<new Date(tom.getTime()+864e5))?'Tomorrow':t.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const time=hasTime?' '+t.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}):'';
  return {cls,label:day+time,t,hasTime}}

/* ---------- seed ---------- */
function seed(){
  const d=n=>{const t=new Date(Date.now()+n*864e5);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
  const mk=(o)=>{const id=uid();S.nodes[id]={id,parent:null,x:0,y:0,title:'',size:2,done:false,due:'',items:[],links:[],...o};return id};
  const it=(t,done=false)=>({id:uid(),text:t,done});
  const a=mk({title:'Client work',size:3,color:COLORS[0],x:60,y:150});
  mk({parent:a,title:'Update portfolio',x:360,y:40,items:[it('Pick six hero projects',true),it('Rewrite case study intros'),it('Check the mobile layout')]});
  mk({parent:a,title:'Send September invoice',x:360,y:215,due:d(2)});
  mk({parent:a,title:'Pitch deck references',size:1,x:360,y:300,links:[{url:'https://www.behance.net',label:''}]});
  const b=mk({title:'Art practice',size:4,color:COLORS[2],x:60,y:470});
  const p=mk({parent:b,title:'Portrait series',x:430,y:430});
  mk({parent:p,title:'Buy 2B–8B pencils',size:1,x:720,y:410,done:true});
  mk({parent:p,title:'Book a model for Saturday',size:1,x:720,y:470,due:d(4)+'T10:00'});

/* ---------- render ---------- */
function cardHTML(n){
  const isRoot=!n.parent;
  const items=(n.items||[]).map(i=>`<li class="${i.done?'done':''}"><button class="ichk ${i.done?'on':''}" data-act="item" data-item="${i.id}" aria-label="Toggle item"></button><span>${esc(i.text)||'&nbsp;'}</span></li>`).join('');
  const di=dueInfo(n.due);
  const links=(n.links||[]).map(l=>`<a class="lnk" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.label||host(l.url))}</a>`).join('');
  let prog='';
  if(isRoot){const d=desc(n.id).map(N);if(d.length)prog=`<span class="prog">${d.filter(x=>x.done).length} of ${d.length} done</span>`}
  else if(n.items&&n.items.length)prog=`<span class="prog">${n.items.filter(i=>i.done).length}/${n.items.length}</span>`;
  const meta=(di||links||prog)?`<div class="meta">${di?`<span class="due ${di.cls}">${esc(di.label)}</span>`:''}${prog}${links}</div>`:'';
  return `<div class="node s${n.size||2}${isRoot?' root':''}${n.done?' done':''}${sel===n.id||msel.has(n.id)?' sel':''}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px;--c:${colorOf(n.id)};${n.w?`width:${n.w}px;max-width:none;`:''}${n.h?`min-height:${n.h}px;`:''}">
<div class="head">${isRoot?'':`<button class="chk" data-act="done" aria-label="Mark done"></button>`}<div class="title">${n.title?esc(n.title):'<span class="ph">Untitled</span>'}</div></div>${items?`<ul class="items">${items}</ul>`:''}${meta}${sel===n.id?[['t','above'],['r','to the right'],['b','below'],['l','to the left']].map(([d,w])=>`<button class="addh ${d}" data-act="add" data-dir="${d}" aria-label="Add a branch ${w}">+</button>`).join(''):''}${foldHTML(n)}${sel===n.id?'<span class="rsz" aria-hidden="true" title="Drag to resize"></span>':''}</div>`;
}
function foldHTML(n){
  const ks=kids(n.id);if(!ks.length)return '';
  const count={};for(const k of ks){const d=sideOf(n,k);count[d]=(count[d]||0)+1}
  const side=Object.keys(count).reduce((a,b)=>count[b]>count[a]?b:a);
  const hid=desc(n.id).length,label=n.collapsed?`Show ${hid} hidden card${hid>1?'s':''}`:'Collapse this branch';
  return `<button class="fold ${side}" data-act="fold" aria-label="${label}" title="${label}">${n.collapsed?'+':'−'}</button>`;
}
function render(){
  if(editing){renderLater=true;return}  // don't wipe a card while its text is being typed in place
  for(const id of msel)if(!N(id)||hiddenNode(id))msel.delete(id);
  nodesEl.innerHTML=visible().map(cardHTML).join('');
  elMap={};nodesEl.querySelectorAll('.node').forEach(e=>elMap[e.dataset.id]=e);
  drawEdges();updateBadge();
  $('#empty').hidden=all().length>0;
}
/* which side of parent p the branch n leaves from: n.side if set (by the + buttons or a drag), else left/right,
   or top/bottom when the card sits directly above or below its parent */
function gaps(p,n){
  const pe=elMap[p.id],ce=elMap[n.id],pw=pe?pe.offsetWidth:200,ph=pe?pe.offsetHeight:44,cw=ce?ce.offsetWidth:160,ch=ce?ce.offsetHeight:44;
  const dx=(n.x+cw/2)-(p.x+pw/2),dy=(n.y+ch/2)-(p.y+ph/2);
  return {dx,dy,gx:Math.abs(dx)-(pw+cw)/2,gy:Math.abs(dy)-(ph+ch)/2};
}
function sideOf(p,n){
  if(n.side)return n.side;
  const {dx,dy,gx,gy}=gaps(p,n);
  return gx<0&&gy>0?(dy>0?'b':'t'):(dx>=0?'r':'l');
}
function updateSide(id){
  const n=N(id),p=n&&n.parent&&N(n.parent);if(!p)return;
  const {dx,dy,gx,gy}=gaps(p,n);
  if(gx<0&&gy>0)n.side=dy>0?'b':'t';else if(gy<0&&gx>0)n.side=dx>0?'r':'l';  // diagonal: keep what it had
}
function drawEdges(){
  const out=[];
  for(const n of all()){
    const p=n.parent&&N(n.parent);if(!p)continue;
    const pe=elMap[p.id],ce=elMap[n.id];if(!pe||!ce)continue;
    const pw=pe.offsetWidth,ph=pe.offsetHeight,cw=ce.offsetWidth,chh=ce.offsetHeight,side=sideOf(p,n),c=colorOf(n.id);
    let d,x2,y2;
    if(side==='t'||side==='b'){
      const down=side==='b',x1=p.x+pw/2,y1=down?p.y+ph:p.y;x2=n.x+cw/2;y2=down?n.y:n.y+chh;
      const dy=Math.max(28,Math.abs(y2-y1)/2)*(down?1:-1);
      d=`M${x1},${y1} C${x1},${y1+dy} ${x2},${y2-dy} ${x2},${y2}`;
    }else{
      const right=side==='r',x1=right?p.x+pw:p.x,y1=p.y+ph/2;x2=right?n.x:n.x+cw;y2=n.y+chh/2;
      const dx=Math.max(28,Math.abs(x2-x1)/2)*(right?1:-1);
      d=`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;
    }
    out.push(`<path class="${n.done?'done':''}" stroke="${c}" d="${d}"/><circle cx="${x2}" cy="${y2}" r="3.2" fill="${c}"/>`);
  }
  edges.innerHTML=out.join('');
}
function applyView(){
  const {x,y,k}=S.view;
  world.style.transform=`translate(${x}px,${y}px) scale(${k})`;
  const g=24*k;canvas.style.backgroundSize=`${g}px ${g}px`;canvas.style.backgroundPosition=`${x}px ${y}px`;
  $('#zoomlbl').textContent=Math.round(k*100)+'%';
}
function zoomAt(cx,cy,f){
  const r=canvas.getBoundingClientRect(),v=S.view,k2=Math.min(2.5,Math.max(.2,v.k*f));
  const px=cx-r.left,py=cy-r.top;v.x=px-(px-v.x)*(k2/v.k);v.y=py-(py-v.y)*(k2/v.k);v.k=k2;applyView();save();
}
function fit(){
  const ns=visible();if(!ns.length){S.view={x:0,y:0,k:1};applyView();return}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const n of ns){const e=elMap[n.id];const w=e?e.offsetWidth:200,h=e?e.offsetHeight:50;x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+w);y1=Math.max(y1,n.y+h)}
  const r=canvas.getBoundingClientRect(),small=r.width<720;
  const top=small?110:70,side=small?16:40;
  const k=Math.min(1.2,Math.max(.2,Math.min((r.width-side*2)/(x1-x0),(r.height-top-30)/(y1-y0))));
  S.view={k,x:(r.width-(x1-x0)*k)/2-x0*k,y:top+((r.height-top-30)-(y1-y0)*k)/2-y0*k};applyView();save();
}
function ensureVisible(id){
  const n=N(id),e=elMap[id];if(!n||!e)return;const r=canvas.getBoundingClientRect(),v=S.view;
  const sx=n.x*v.k+v.x,sy=n.y*v.k+v.y,w=e.offsetWidth*v.k,h=e.offsetHeight*v.k;
  const small=r.width<720,rightLimit=small?r.width:r.width-370,bottomLimit=small?r.height*.4:r.height;
  let dx=0,dy=0;
  if(sx+w>rightLimit-20)dx=rightLimit-20-(sx+w);if(sx+dx<20)dx=20-sx;
  if(sy+h>bottomLimit-20)dy=bottomLimit-20-(sy+h);if(sy+dy<(small?110:70))dy=(small?110:70)-sy;
  if(dx||dy){v.x+=dx;v.y+=dy;applyView();save()}
}

/* ---------- node ops ---------- */
function create(o){
  const id=uid();
  S.nodes[id]={id,parent:null,x:0,y:0,title:'',size:2,done:false,due:'',items:[],links:[],_new:true,...o};
  if(o.parent&&N(o.parent))delete N(o.parent).collapsed;
  if(!S.nodes[id].parent&&!S.nodes[id].color){const used=all().filter(n=>!n.parent).length-1;S.nodes[id].color=COLORS[used%COLORS.length]}
  save();return id;
}
function height(id){return elMap[id]?elMap[id].offsetHeight:44}
function addChild(pid){
  const p=N(pid);const pw=elMap[pid]?elMap[pid].offsetWidth:200;
  const ks=kids(pid);let x=p.x+pw+90,y=p.y;
  if(ks.length){const side=ks.filter(k=>k.x>=p.x);const base=side.length?side:ks;let maxB=-1e9;
    for(const k of base){const b=k.y+height(k.id);if(b>maxB){maxB=b;x=k.x}}y=maxB+16}
  const size=p.parent?Math.min(p.size||2,2):Math.max(1,(p.size||3)-1);
  return create({parent:pid,x,y,size:Math.min(size,2)});
}
function addChildDir(pid,dir){
  if(editing)finishEdit();
  if(dir==='r'){const id=addChild(pid);N(id).side='r';return id}
  const p=N(pid),pw=elMap[pid]?elMap[pid].offsetWidth:200,ph=height(pid);
  const size=Math.min(p.parent?Math.min(p.size||2,2):Math.max(1,(p.size||3)-1),2);
  const row=kids(pid).filter(k=>sideOf(p,k)===dir),w=k=>elMap[k.id]?elMap[k.id].offsetWidth:160;
  let x,y,alignRight=null,alignBottom=null;
  if(dir==='l'){
    if(row.length){const last=row.reduce((a,k)=>k.y+height(k.id)>a.y+height(a.id)?k:a);y=last.y+height(last.id)+16;alignRight=last.x+w(last)}
    else{y=p.y;alignRight=p.x-90}
    x=alignRight-160;
  }else{
    if(row.length){const last=row.reduce((a,k)=>k.x+w(k)>a.x+w(a)?k:a);x=last.x+w(last)+16;
      if(dir==='b')y=last.y;else alignBottom=last.y+height(last.id)}
    else{x=p.x;if(dir==='b')y=p.y+ph+56;else alignBottom=p.y-56}
    if(dir==='t')y=alignBottom-44;
  }
  const id=create({parent:pid,x:Math.round(x),y:Math.round(y),size,side:dir});
  render();  // measure the new card, then line it up against the side it grew from
  const n=N(id),el=elMap[id];
  if(el&&alignRight!==null)n.x=Math.round(alignRight-el.offsetWidth);
  if(el&&alignBottom!==null)n.y=Math.round(alignBottom-el.offsetHeight);
  return id;
}
function addSibling(id){
  const n=N(id);
  if(!n.parent){let maxB=-1e9;for(const r of all().filter(r=>!r.parent)){const b=r.y+height(r.id)+desc(r.id).reduce((m,d)=>Math.max(m,N(d).y+height(d)-r.y-height(r.id)),0);if(Math.abs(r.x-n.x)<200)maxB=Math.max(maxB,b)}
    return create({x:n.x,y:maxB+60,size:n.size})}
  const sibs=kids(n.parent).filter(s=>Math.abs(s.x-n.x)<60);let maxB=n.y+height(id);
  for(const s of sibs)maxB=Math.max(maxB,s.y+height(s.id));
  return create({parent:n.parent,x:n.x,y:maxB+16,size:n.size});
}
function isEmpty(n){return n&&n._new&&!n.title&&!(n.items||[]).length&&!(n.links||[]).length&&!n.due&&!kids(n.id).length}
let undoSnap=null;
function del(id){delMany([id])}
function delMany(list){
  list=list.filter(N);if(!list.length)return;
  const ids=[...new Set(list.flatMap(i=>[i,...desc(i)]))],n=N(list[0]),extra=ids.length-list.length;
  undoSnap=ids.map(i=>JSON.parse(JSON.stringify(N(i))));
  ids.forEach(i=>delete S.nodes[i]);
  sel=null;msel.clear();closePanel();render();save();
  const what=list.length>1?`${list.length} cards`:`“${n.title||'Untitled'}”`;
  toast(`Deleted ${what}`+(extra?` and ${extra} branch${extra>1?'es':''}`:''),'Undo',()=>{
    undoSnap.forEach(s=>S.nodes[s.id]=s);undoSnap=null;render();save();if(list.length===1)select(list[0])});
}

/* ---------- selection & panel ---------- */
function select(id,focus){

/* Shift+click adds a card to (or removes it from) a multi-selection */
function toggleMulti(id){

panel.addEventListener('input',e=>{

  else if(t.id==='pDate'||t.id==='pTime'){const dv=$('#pDate').value,tv=$('#pTime').value;n.due=dv?dv+(tv?'T'+tv:''):'';n.alerted=null;delete n._new;
    $('#pTime').disabled=!dv;render();save();if(t.id==='pDate'){renderPanel()}return}
  else return;

panel.addEventListener('keydown',e=>{

  if(t.id==='pTitle'){

panel.addEventListener('click',e=>{

  }

function doAttach(target){

  const n=N(from);n.parent=target;delete N(target).collapsed;if((n.size||2)>2)n.size=2;render();renderPanel();save();toast('Attached');

/* ---------- card clicks (checkboxes) ---------- */
nodesEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const id=b.closest('.node').dataset.id;const n=N(id);
  if(b.dataset.act==='add'){select(addChildDir(id,b.dataset.dir),true);return}
  if(b.dataset.act==='fold'){
    if(n.collapsed)delete n.collapsed;else n.collapsed=true;
    if(sel&&hiddenNode(sel)){sel=null;closePanel()}
    render();if(msel.size)renderPanel();save();return;
  }
  if(b.dataset.act==='done'){n.done=!n.done;delete n._new}
  else if(b.dataset.act==='item'){const i=n.items.find(i=>i.id===b.dataset.item);if(i)i.done=!i.done}
  render();if(sel===id)renderPanel();save();
});

/* ---------- edit a card's text in place (double-click / double-tap) ---------- */
let editing=null,editEl=null,editOrig='',renderLater=false,lastTap={};
function startEdit(id){
  const n=N(id),el=elMap[id]&&elMap[id].querySelector('.title');if(!n||!el)return;
  editing=id;editEl=el;editOrig=n.title||'';renderLater=false;
  el.textContent=n.title||'';
  try{el.contentEditable='plaintext-only'}catch(_){el.contentEditable='true'}
  el.focus();
  const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);
  el.addEventListener('input',()=>{n.title=el.innerText.replace(/\n$/,'');if(n.title)delete n._new;const t=$('#pTitle');if(t)t.value=n.title;drawEdges();save()});
  el.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();el.blur()}
    else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();n.title=editOrig;el.blur()}
  });
  el.addEventListener('blur',finishEdit,{once:true});
}
function finishEdit(){
  if(!editing)return;
  const n=N(editing),el=editEl;editing=editEl=null;
  // update just this card (a full render here would swap out a + button mid-click)
  el.removeAttribute('contenteditable');
  if(n){if(n.title)el.textContent=n.title;else el.innerHTML='<span class="ph">Untitled</span>'}
  if(renderLater||!n)render();else{drawEdges();updateBadge()}
  if(sel)renderPanel();save();
}

/* ---------- pointer: pan, drag, pinch ---------- */
const pts=new Map();let g=null;
canvas.addEventListener('pointerdown',e=>{
  if(e.target.closest('[contenteditable]'))return;
  if(editing)finishEdit();
  if(e.target.closest('button,a'))return;
  const rz=e.target.closest('.rsz');
  if(rz&&pts.size===0){
    const id=rz.closest('.node').dataset.id,el=elMap[id];
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{canvas.setPointerCapture(e.pointerId)}catch(_){}
    g={type:'resize',id,sx:e.clientX,sy:e.clientY,ow:el.offsetWidth,oh:el.offsetHeight,moved:false};return;
  }
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  if(pts.size===2){const [a,b]=[...pts.values()];g={type:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};return}
  if(pts.size>2)return;
  const ne=e.target.closest('.node');
  if(ne){
    const id=ne.dataset.id;
    if(attachFrom){g={type:'attach',id};return}
    const base=msel.has(id)?[...msel]:[id];  // dragging a selected card moves the whole selection
    const ids=[...new Set(base.flatMap(i=>moveMode==='branch'?[i,...desc(i)]:[i]))];
    g={type:'drag',id,base,shift:e.shiftKey,sx:e.clientX,sy:e.clientY,orig:ids.map(i=>[i,N(i).x,N(i).y]),moved:false};
  }else{
    // mouse drag on empty space draws a selection box; touch, middle button or Space+drag pans
    if(e.pointerType==='mouse'&&e.button===0&&!spaceDown&&!attachFrom){
      const base=new Set(e.shiftKey?(msel.size?msel:sel?[sel]:[]):[]);
      g={type:'marquee',sx:e.clientX,sy:e.clientY,base,moved:false};
    }else g={type:'pan',sx:e.clientX,sy:e.clientY,vx:S.view.x,vy:S.view.y,moved:false};
  }
});
/* ---------- snapping while dragging: edges, centres and matching gaps (hold Alt/Option to place freely) ---------- */
const guidesEl=$('#guides');
function rectOf(id){const n=N(id),e=elMap[id];return {x:n.x,y:n.y,w:e?e.offsetWidth:160,h:e?e.offsetHeight:44}}
const flip=r=>({x:r.y,y:r.x,w:r.h,h:r.w});
// neighbouring side-by-side pairs of cards and the gap between them (x axis; call with flipped rects for y)
function gapPairs(refs){
  const out=[];
  for(const a of refs){let best=null;
    for(const b of refs){if(b===a||!(a.y<b.y+b.h&&b.y<a.y+a.h))continue;const d=b.x-(a.x+a.w);if(d>0&&d<600&&(!best||d<best.d))best={d,a,b}}
    if(best)out.push(best)}
  return out;
}
function snapPrep(moving,id){
  const refs=Object.keys(elMap).filter(i=>!moving.has(i)).map(rectOf),fl=refs.map(flip);
  return {me:rectOf(id),refs,fl,px:gapPairs(refs),py:gapPairs(fl)};
}
// best x adjustment within T for rect r; returns {d, segs(finalRect)} with segments as [x1,y1,x2,y2]
function snapX(r,refs,pairs,T){
  let best=null;const take=(d,segs)=>{if(Math.abs(d)<=T&&(!best||Math.abs(d)<Math.abs(best.d)-.01))best={d,segs}};
  const lines=f=>[f.x,f.x+f.w/2,f.x+f.w];
  for(const f of refs)for(const a of lines(f))for(const m of [0,r.w/2,r.w])take(a-(r.x+m),fr=>{
    const hit=refs.filter(o=>lines(o).some(v=>Math.abs(v-a)<.6));
    const ys=[fr.y,fr.y+fr.h,...hit.flatMap(o=>[o.y,o.y+o.h])];
    return [[a,Math.min(...ys)-8,a,Math.max(...ys)+8]];
  });
  const ov=f=>f.y<r.y+r.h&&r.y<f.y+f.h,cx=r.x+r.w/2;let L=null,R=null;
  for(const f of refs){if(!ov(f))continue;
    if(f.x+f.w<=cx&&(!L||f.x+f.w>L.x+L.w))L=f;
    if(f.x>=cx&&(!R||f.x<R.x))R=f}
  const mid=(a,b)=>(Math.max(a.y,b.y)+Math.min(a.y+a.h,b.y+b.h))/2;
  const gapSegs=(d,fr)=>{
    const segs=[];
    if(L&&Math.abs(fr.x-(L.x+L.w)-d)<1)segs.push([L.x+L.w,mid(L,fr),fr.x,mid(L,fr)]);
    if(R&&Math.abs(R.x-(fr.x+fr.w)-d)<1)segs.push([fr.x+fr.w,mid(R,fr),R.x,mid(R,fr)]);
    for(const p of pairs)if(Math.abs(p.d-d)<1)segs.push([p.a.x+p.a.w,mid(p.a,p.b),p.b.x,mid(p.a,p.b)]);
    return segs.flatMap(([x1,y,x2])=>[[x1,y,x2,y],[x1,y-4,x1,y+4],[x2,y-4,x2,y+4]]);
  };
  for(const p of pairs){
    if(L)take(L.x+L.w+p.d-r.x,fr=>gapSegs(p.d,fr));
    if(R)take(R.x-p.d-(r.x+r.w),fr=>gapSegs(p.d,fr));
  }
  if(L&&R){const x=(L.x+L.w+R.x-r.w)/2,d=x-(L.x+L.w);if(d>0)take(x-r.x,fr=>gapSegs(d,fr))}
  return best;
}
function drawGuides(segs){
  const k=S.view.k;
  guidesEl.innerHTML=segs.length?`<path stroke-width="${1.2/k}" d="${segs.map(([a,b,c,d])=>`M${a},${b}L${c},${d}`).join('')}"/>`:'';
}

canvas.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)||!g)return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(g.type==='pinch'&&pts.size===2){
    const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    zoomAt(mx,my,d/g.d);S.view.x+=mx-g.mx;S.view.y+=my-g.my;applyView();g.d=d;g.mx=mx;g.my=my;return;
  }
  const dx=e.clientX-g.sx,dy=e.clientY-g.sy;
  if(!g.moved&&Math.hypot(dx,dy)<4)return;g.moved=true;
  if(g.type==='pan'){canvas.classList.add('panning');S.view.x=g.vx+dx;S.view.y=g.vy+dy;applyView()}
  else if(g.type==='marquee'){
    const cr=canvas.getBoundingClientRect(),v=S.view,m=$('#marquee');
    const x0=Math.min(g.sx,e.clientX)-cr.left,y0=Math.min(g.sy,e.clientY)-cr.top,x1=Math.max(g.sx,e.clientX)-cr.left,y1=Math.max(g.sy,e.clientY)-cr.top;
    Object.assign(m.style,{left:x0+'px',top:y0+'px',width:(x1-x0)+'px',height:(y1-y0)+'px'});m.hidden=false;
    const wx0=(x0-v.x)/v.k,wy0=(y0-v.y)/v.k,wx1=(x1-v.x)/v.k,wy1=(y1-v.y)/v.k;
    g.hits=new Set(g.base);
    for(const id in elMap){const r=rectOf(id);if(r.x<wx1&&r.x+r.w>wx0&&r.y<wy1&&r.y+r.h>wy0)g.hits.add(id)}
    for(const id in elMap)elMap[id].classList.toggle('sel',g.hits.has(id));
  }
  else if(g.type==='resize'){
    const k=S.view.k,n=N(g.id),el=elMap[g.id];if(!n||!el)return;
    let w=Math.max(120,g.ow+dx/k),h=Math.max(36,g.oh+dy/k),segs=[];
    if(!e.altKey){  // snap the right and bottom edges to other cards' edges and centres
      if(!g.snap)g.snap=snapPrep(new Set([g.id]),g.id);
      const T=7/k,near=(v,list)=>{let b=null;for(const a of list)if(Math.abs(a-v)<=T&&(b===null||Math.abs(a-v)<Math.abs(b-v)))b=a;return b};
      const xs=g.snap.refs.flatMap(f=>[f.x,f.x+f.w/2,f.x+f.w]),ys=g.snap.refs.flatMap(f=>[f.y,f.y+f.h/2,f.y+f.h]);
      const bx=near(n.x+w,xs),by=near(n.y+h,ys);
      if(bx!==null&&bx-n.x>=120){w=bx-n.x;const hit=g.snap.refs.filter(f=>[f.x,f.x+f.w/2,f.x+f.w].some(v=>Math.abs(v-bx)<.6)),yy=[n.y,n.y+h,...hit.flatMap(f=>[f.y,f.y+f.h])];segs.push([bx,Math.min(...yy)-8,bx,Math.max(...yy)+8])}
      if(by!==null&&by-n.y>=36){h=by-n.y;const hit=g.snap.refs.filter(f=>[f.y,f.y+f.h/2,f.y+f.h].some(v=>Math.abs(v-by)<.6)),xx=[n.x,n.x+w,...hit.flatMap(f=>[f.x,f.x+f.w])];segs.push([Math.min(...xx)-8,by,Math.max(...xx)+8,by])}
    }
    n.w=Math.round(w);if(Math.abs(dy)>2||n.h)n.h=Math.round(h);
    el.style.width=n.w+'px';el.style.maxWidth='none';if(n.h)el.style.minHeight=n.h+'px';
    drawGuides(segs);drawEdges();
  }
  else if(g.type==='drag'){
    const k=S.view.k;let mx=dx/k,my=dy/k,segs=[];
    if(!e.altKey){
      if(!g.snap)g.snap=snapPrep(new Set(g.orig.map(o=>o[0])),g.id);
      const p=g.snap,T=7/k,r={...p.me,x:p.me.x+mx,y:p.me.y+my};
      const sx=snapX(r,p.refs,p.px,T),sy=snapX(flip(r),p.fl,p.py,T);
      if(sx)mx+=sx.d;if(sy)my+=sy.d;
      const fr={...p.me,x:p.me.x+mx,y:p.me.y+my};
      if(sx)segs.push(...sx.segs(fr));
      if(sy)segs.push(...sy.segs(flip(fr)).map(([a,b,c,d])=>[b,a,d,c]));
    }
    drawGuides(segs);
    for(const [i,ox,oy] of g.orig){const n=N(i);n.x=Math.round(ox+mx);n.y=Math.round(oy+my);const el=elMap[i];if(el){el.style.left=n.x+'px';el.style.top=n.y+'px'}}
    drawEdges();
  }
});
function endPointer(e){
  if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);drawGuides([]);
  if(!g)return;
  if(g.type==='pinch'){if(pts.size===0)g=null;else g={type:'none'};save();return}
  if(g.type==='attach'){doAttach(g.id)}
  else if(g.type==='resize'){if(g.moved){delete N(g.id)._new;render();renderPanel();save()}}
  else if(g.type==='drag'){
    if(g.moved){for(const b of g.base){updateSide(b);if(moveMode==='card')kids(b).forEach(k=>updateSide(k.id))}drawEdges();save()}
    const id=g.id;
    if(g.shift&&!g.moved){toggleMulti(id);lastTap={};g=null;return}
    if(g.moved&&msel.has(id)){g=null;return}
    const now=Date.now(),dbl=!g.moved&&lastTap.id===id&&now-lastTap.t<400;
    lastTap=g.moved||dbl?{}:{id,t:now};
    if(sel!==id)select(id);else if(!g.moved)renderPanel();
    if(dbl)startEdit(id);
  }
  else if(g.type==='pan'){canvas.classList.remove('panning');if(g.moved)save();else if(attachFrom)doAttach(null);else if(sel||msel.size)deselect()}
  else if(g.type==='marquee'){
    $('#marquee').hidden=true;
    if(!g.moved){if(sel||msel.size)deselect()}
    else{
      const hits=[...(g.hits||[])];
      if(!hits.length)deselect();
      else if(hits.length===1)select(hits[0]);
      else{if(sel&&isEmpty(N(sel)))delete S.nodes[sel];sel=null;msel=new Set(hits);closeDue();render();renderPanel()}
    }
  }
  g=null;
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('dblclick',e=>{
  const under=document.elementFromPoint(e.clientX,e.clientY);if(under&&under.closest('.node'))return;
  const r=canvas.getBoundingClientRect(),v=S.view;
  const id=create({x:Math.round((e.clientX-r.left-v.x)/v.k),y:Math.round((e.clientY-r.top-v.y)/v.k-20),size:3});
  select(id,true);
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.ctrlKey||e.metaKey)zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.01));
  else{S.view.x-=e.deltaX;S.view.y-=e.deltaY;applyView();save()}
},{passive:false});

  const roots=all().filter(n=>!n.parent);

$('#moveSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;moveMode=b.dataset.m;
  $('#moveSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};
$('#bIn').onclick=()=>{const r=canvas.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.2)};
$('#bOut').onclick=()=>{const r=canvas.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.2)};

/* ---------- due list ---------- */
function updateBadge(){
  const c=all().filter(n=>!n.done&&dueInfo(n.due)&&dueInfo(n.due).cls!=='later').length;
  const b=$('#dueBadge');b.hidden=!c;b.textContent=c;
}
function closeDue(){duelist.hidden=true}
function renderDue(){
  const rows=all().filter(n=>!n.done&&dueInfo(n.due)).map(n=>({n,d:dueInfo(n.due)})).sort((a,b)=>a.d.t-b.d.t);
  const grp=(name,list)=>list.length?`<div class="grp"><h3>${name}</h3>${list.map(({n,d})=>`<button class="drow ${d.cls}" data-go="${n.id}" style="--c:${colorOf(n.id)}"><span class="t">${esc(n.title||'Untitled')}</span><span class="d">${esc(d.label)}</span></button>`).join('')}</div>`:'';
  const over=rows.filter(r=>r.d.cls==='over'),today=rows.filter(r=>r.d.cls==='today'),later=rows.filter(r=>r.d.cls==='later');
  duelist.innerHTML=`<div class="top"><span>Due dates</span><button class="x" data-close aria-label="Close">×</button></div>
  <div class="body">${rows.length?grp('Overdue',over)+grp('Today',today)+grp('Coming up',later):'<p class="hint" style="margin:0">Nothing has a due date yet. Select a task and set one in its panel.</p>'}
  <p class="hint" style="margin:0">Reminders pop up here while this page is open. Tasks are only checked when the page is running.</p></div>`;
}
$('#bDue').onclick=()=>{if(!duelist.hidden){closeDue();return}if(sel)deselect();renderDue();duelist.hidden=false};
duelist.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){closeDue();return}
  const r=e.target.closest('[data-go]');if(!r)return;const id=r.dataset.go;
  closeDue();const n=N(id),rect=canvas.getBoundingClientRect(),el=elMap[id],v=S.view;
  const w=el?el.offsetWidth:200,h=el?el.offsetHeight:40,cx=rect.width<720?rect.width/2:(rect.width-360)/2;
  v.x=cx-(n.x+w/2)*v.k;v.y=(rect.width<720?rect.height*.25:rect.height/2)-(n.y+h/2)*v.k;applyView();save();select(id);
});

/* ---------- reminders while open ---------- */
function checkReminders(){
  const now=Date.now();
  for(const n of all()){
    if(n.done||!n.due||n.alerted===n.due)continue;const d=dueInfo(n.due);if(!d)continue;
    const due=d.hasTime?d.t.getTime():d.t.getTime()+9*36e5;
    if(due<=now){n.alerted=n.due;save();if(now-due<15*60e3)toast(`Due now: ${n.title||'Untitled'}`,'Show',()=>{select(n.id)})}
  }
  updateBadge();
}
setInterval(checkReminders,30e3);

$('#bBackup').onclick=openModal;
$('#bkClose').onclick=()=>$('#modal').hidden=true;
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').hidden=true});

  const t=$('#bkOut');try{await navigator.clipboard.writeText(t.value);toast('Backup copied')}
  catch(e){t.focus();t.select();try{document.execCommand('copy');toast('Backup copied')}catch(_){toast('Select the text and copy it manually')}}

  try{const d=JSON.parse($('#bkIn').value);if(!d||typeof d.nodes!=='object')throw 0;
    const prev=JSON.stringify(S.nodes);S.nodes=d.nodes;sel=null;closePanel();render();fit();save();$('#modal').hidden=true;
    toast('Board restored from backup','Undo',()=>{S.nodes=JSON.parse(prev);render();fit();save()})}

/* ---------- toast ---------- */
let toastT;
function toast(msg,act,fn){
  $('#toastMsg').textContent=msg;const b=$('#toastAct');
  if(act){b.hidden=false;b.textContent=act;b.onclick=()=>{$('#toast').hidden=true;fn&&fn()}}else b.hidden=true;
  $('#toast').hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').hidden=true,act?6000:3000);
}

/* ---------- keyboard ---------- */
/* hold Space to pan with the mouse */
let spaceDown=false;
document.addEventListener('keydown',e=>{
  if(e.code!=='Space'||/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(e.target.tagName)||e.target.isContentEditable)return;
  e.preventDefault();if(!spaceDown){spaceDown=true;canvas.classList.add('spacepan')}
});
document.addEventListener('keyup',e=>{if(e.code==='Space'){spaceDown=false;canvas.classList.remove('spacepan')}});
window.addEventListener('blur',()=>{spaceDown=false;canvas.classList.remove('spacepan')});
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;
  if(e.key==='Escape'){
    if(attachFrom){attachFrom=null;canvas.classList.remove('attaching');toast('Attach cancelled');return}
    if(!$('#modal').hidden){$('#modal').hidden=true;return}
    if(typing){e.target.blur();return}
    if(!duelist.hidden){closeDue();return}
    if(sel||msel.size)deselect();return;
  }
  if(typing||!$('#modal').hidden)return;
  if(msel.size>1){if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();delMany([...msel])}return}
  if(!sel)return;
  if(e.key==='Tab'){e.preventDefault();select(addChild(sel),true)}
  else if(e.key==='Enter'){e.preventDefault();const t=$('#pTitle');if(t)t.focus()}
  else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();del(sel)}
});

/* ---------- sync (Firebase: one Firestore doc per card under users/{uid}/nodes) ---------- */
const FB='https://www.gstatic.com/firebasejs/12.19.0/';
const SYNC_UID='branches.syncUid',PRESYNC='branches.presync';
let fb=null,db=null,user=null,unsub=null,firstSnap=true,synced={},pushT=null;
const canon=v=>Array.isArray(v)?'['+v.map(canon).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}':JSON.stringify(v??null);
const clean=n=>{const o={...n};delete o._new;return o};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function setSync(st){
  const lbl={off:'Sync',loading:'Connecting…',ok:'Synced',saving:'Saving…',offline:'Offline',error:'Sync error'}[st];
  $('#syncDot').className='sdot '+st;$('#syncLbl').textContent=lbl;
}
function renderSyncBox(){
  $('#syncSec').hidden=!FIREBASE_CONFIG;if(!FIREBASE_CONFIG)return;
  $('#syncBox').innerHTML=user
    ?`<p class="hint" style="margin:0">Signed in as <b>${esc(user.email||user.displayName||'you')}</b>. Changes appear on every device where you're signed in.</p><div class="row"><button class="btn" id="bSignOut" style="border:1px solid var(--line)">Sign out on this device</button></div>`
    :`<p class="hint" style="margin:0">Sign in with Google to keep this board in step across your laptop and phone.</p><div class="row"><button class="btn primary" id="bSignIn">Sign in with Google</button></div>`;
  $('#presyncBox').hidden=!(user&&lsGet(PRESYNC));
}
function queuePush(){if(!user||firstSnap)return;clearTimeout(pushT);pushT=setTimeout(push,400)}
function push(){
  clearTimeout(pushT);if(!user||firstSnap)return;
  const ops=[];
  for(const n of all()){if(isEmpty(n))continue;const c=clean(n),s=canon(c);if(synced[n.id]!==s){ops.push([n.id,c]);synced[n.id]=s}}
  for(const id in synced)if(!S.nodes[id]){ops.push([id,null]);delete synced[id]}
  for(let i=0;i<ops.length;i+=400){
    const b=fb.writeBatch(db);
    for(const [id,d] of ops.slice(i,i+400)){const r=fb.doc(db,'users',user.uid,'nodes',id);d?b.set(r,d):b.delete(r)}
    b.commit().catch(e=>{console.error(e);setSync('error')});
  }
}
function onRemote(snap){
  const m=snap.metadata;
  if(firstSnap){
    if(m.fromCache&&snap.empty)return;           // wait for the server before deciding anything
    firstSnap=false;
    const remote={};snap.forEach(d=>remote[d.id]={...d.data(),id:d.id});
    const known=lsGet(SYNC_UID)===user.uid;lsSet(SYNC_UID,user.uid);
    if(snap.empty&&!known){synced={};push();toast('Signed in. This board now syncs to your other devices.')}
    else{
      const mine=all().filter(n=>!isEmpty(n));
      if(!known&&mine.length&&canon(Object.fromEntries(mine.map(n=>[n.id,clean(n)])))!==canon(remote)){
        lsSet(PRESYNC,JSON.stringify(S.nodes));toast('Loaded your synced board. This device’s old board was kept aside.','Details',openModal);
      }else if(!known)toast('Signed in. Your synced board is loaded.');
      S.nodes=remote;synced={};for(const id in remote)synced[id]=canon(remote[id]);
      if(sel&&!N(sel)){sel=null;closePanel()}
      render();if(!known)fit();save();
    }
  }else{
    let changed=false;
    for(const c of snap.docChanges()){
      const id=c.doc.id;
      if(c.type==='removed'){delete synced[id];if(S.nodes[id]){delete S.nodes[id];changed=true;if(sel===id){sel=null;closePanel()}}continue}
      if(c.doc.metadata.hasPendingWrites)continue;   // our own write coming back
      const d={...c.doc.data(),id},s=canon(d),local=N(id);
      const pending=local&&synced[id]!==undefined&&canon(clean(local))!==synced[id];
      synced[id]=s;
      if(pending||(local&&canon(clean(local))===s))continue;  // unsent local edit wins; identical needs nothing
      S.nodes[id]=d;changed=true;
    }
    if(changed){render();if(sel&&!panel.contains(document.activeElement))renderPanel();save()}
  }
  setSync(m.hasPendingWrites?'saving':m.fromCache?'offline':'ok');
  renderSyncBox();
}
async function initSync(){
  if(!FIREBASE_CONFIG)return;
  $('#bSync').hidden=false;setSync('loading');
  try{
    const [app,auth,fs]=await Promise.all(['app','auth','firestore'].map(x=>import(FB+'firebase-'+x+'.js')));
    fb={...auth,...fs};
    const a=app.initializeApp(FIREBASE_CONFIG);
    fb.au=auth.getAuth(a);
    db=fs.initializeFirestore(a,{ignoreUndefinedProperties:true,localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})});
    auth.onAuthStateChanged(fb.au,u=>{
      if(unsub){unsub();unsub=null}
      user=u;firstSnap=true;synced={};
      if(!u){setSync('off');renderSyncBox();return}
      setSync('loading');renderSyncBox();
      unsub=fs.onSnapshot(fs.collection(db,'users',u.uid,'nodes'),{includeMetadataChanges:true},onRemote,e=>{console.error(e);setSync('error');toast('Sync stopped: '+(e.code||e.message))});
    });
  }catch(e){console.error(e);setSync('error')}
}
$('#bSync').onclick=()=>{if(!fb)return;if(!user)signIn();else openModal()};
function signIn(){
  fb.signInWithPopup(fb.au,new fb.GoogleAuthProvider()).catch(e=>{if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')toast('Sign-in failed: '+(e.code||e.message))});
}
$('#modal').addEventListener('click',e=>{
  if(e.target.id==='bSignIn')signIn();
  else if(e.target.id==='bSignOut'){push();fb.signOut(fb.au);lsSet(SYNC_UID,null);toast('Signed out. The board stays on this device but no longer syncs.')}
  else if(e.target.id==='bkPresync'){
    try{const prev=JSON.stringify(S.nodes);S.nodes=JSON.parse(lsGet(PRESYNC));lsSet(PRESYNC,null);sel=null;closePanel();render();fit();save();$('#modal').hidden=true;
      toast('Board replaced','Undo',()=>{S.nodes=JSON.parse(prev);render();fit();save()})}catch(_){}
  }
  else if(e.target.id==='bkPresyncDrop'){lsSet(PRESYNC,null);renderSyncBox()}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&user)push()});

/* ---------- boot ---------- */
const had=load();
if(!had)seed();
applyView();render();
if(!had)requestAnimationFrame(()=>{render();fit()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{drawEdges()});
checkReminders();
initSync();
window.addEventListener('resize',()=>applyView());
})();
</script>
</body>
