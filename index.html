// double-click an empty day (or a time slot in day/week view) to add a box due then
calEl.addEventListener('dblclick',e=>{
  if(e.target.closest('.chip,button'))return;
  const cell=e.target.closest('[data-day]');if(!cell)return;
  let due=cell.dataset.day;
  if(cell.dataset.timed){const h=Math.max(0,Math.min(23,Math.floor((e.clientY-cell.getBoundingClientRect().top)/HH)));due+='T'+pad2(h)+':00'}
  calDate=keyToDate(cell.dataset.day);newBox({due});
});

/* ---------- undo / redo / history (since the page was opened) ----------
   hist is a list of board states; hi points at the current one. Every save() queues a checkpoint;
   changes within half a second merge into one step. */
let hist=[],hi=0,ckT=null,nextLabel=null;
const snapNodes=()=>JSON.stringify(Object.fromEntries(all().filter(n=>!isEmpty(n)).map(n=>[n.id,clean(n)])));
function queueCheckpoint(){clearTimeout(ckT);ckT=setTimeout(checkpoint,500)}
function checkpoint(){
  clearTimeout(ckT);if(!hist.length)return;
  const j=snapNodes(),label=nextLabel;nextLabel=null;
  if(j===hist[hi].json)return;
  hist=hist.slice(0,hi+1);
  hist.push({json:j,label:label||describe(JSON.parse(hist[hi].json),JSON.parse(j)),t:Date.now()});
  if(hist.length>400)hist.splice(1,1);
  hi=hist.length-1;updateHistUI();
}
function describe(a,b){
  const nm=(m,ids)=>ids.length>1?`${ids.length} boxes`:`“${((m[ids[0]]||{}).title||'Untitled').slice(0,30)}”`;
  const removed=Object.keys(a).filter(i=>!b[i]),added=Object.keys(b).filter(i=>!a[i]);
  if(removed.length)return 'Deleted '+nm(a,removed);
  if(added.length)return 'Added '+nm(b,added);
  const changed=Object.keys(b).filter(i=>canon(a[i])!==canon(b[i]));if(!changed.length)return 'Edited';
  const keys=new Set();for(const i of changed)for(const k of new Set([...Object.keys(a[i]),...Object.keys(b[i])]))if(canon(a[i][k])!==canon(b[i][k]))keys.add(k);
  const only=(...ks)=>[...keys].every(k=>ks.includes(k)),who=nm(b,changed);
  if(only('x','y','side'))return 'Moved '+who;
  if(only('w','h'))return 'Resized '+who;
  if(only('title'))return 'Edited text of '+who;
  if(only('task','done')&&changed.some(i=>!!a[i].task!==!!b[i].task))return (changed.every(i=>b[i].task)?'Made a task: ':'No longer a task: ')+who;
  if(only('done'))return (changed.every(i=>b[i].done)?'Ticked ':'Unticked ')+who;
  if(only('color'))return 'Recoloured '+who;
  if(only('size'))return 'Changed text size of '+who;
  if(only('collapsed'))return (changed.every(i=>b[i].collapsed)?'Collapsed ':'Expanded ')+who;
  if(only('parent','side'))return 'Relinked '+who;
  if(only('items'))return 'Edited list in '+who;
  if(only('links'))return 'Edited links in '+who;
  if(only('due','alerted'))return 'Changed due date of '+who;
  if(only('repeat','task','done','due'))return 'Changed repeat of '+who;
  if(only('notify'))return 'Changed email reminder of '+who;
  return 'Edited '+who;
}
function goTo(i){
  if(editing)finishEdit();checkpoint();
  if(i<0||i>=hist.length||i===hi)return;
  hi=i;S.nodes=JSON.parse(hist[i].json);
  if(sel&&!N(sel)){sel=null;closePanel()}
  renderQuiet();if(sel||msel.size)renderPanel();save();updateHistUI();
}
function undo(){checkpoint();goTo(hi-1)}
function redo(){goTo(hi+1)}
const histEl=$('#histlist');
function closeHist(){histEl.hidden=true}
function ago(t){const s=Math.round((Date.now()-t)/1000);return s<45?'just now':s<3600?Math.round(s/60)+' min ago':Math.round(s/3600)+' h ago'}
function renderHist(){
  const rows=hist.map((h,i)=>({h,i})).reverse().map(({h,i})=>`<button class="hrow${i===hi?' cur':''}${i>hi?' future':''}" data-i="${i}"><span class="t">${esc(h.label)}</span><span class="d">${ago(h.t)}</span></button>`).join('');
  histEl.innerHTML=`<div class="top"><span>History since you opened the page</span><button class="x" data-close aria-label="Close">×</button></div>
  <div class="body"><div class="hl">${rows}</div><p class="hint" style="margin:0">Click a step to take the board back to that moment. Greyed steps are ones you undid; click them to redo.</p></div>`;
}
function updateHistUI(){$('#bUndo').disabled=hi<=0;$('#bRedo').disabled=hi>=hist.length-1;if(!histEl.hidden)renderHist()}
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
$('#bHist').onclick=()=>{if(!histEl.hidden){closeHist();return}if(sel||msel.size)deselect();closeDue();checkpoint();renderHist();histEl.hidden=false};
histEl.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){closeHist();return}
  const r=e.target.closest('[data-i]');if(r)goTo(+r.dataset.i);
});

/* ---------- boot ---------- */
const had=load();
if(!had)seed();
applyView();render();
if(!had)requestAnimationFrame(()=>{render();fit()});
hist=[{json:snapNodes(),label:'Opened the page',t:Date.now()}];hi=0;updateHistUI();
setView(lsGet('branches.view')||'branches');
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{drawEdges()});
checkReminders();
initSync();
window.addEventListener('resize',()=>applyView());
})();
</script>
