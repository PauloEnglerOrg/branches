<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Branches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E3E6E9; --card:#FBFCFC; --ink:#1B2025; --muted:#66707A; --line:#D0D5DA;
  --accent:#2E57E6; --warn:#CF3429; --soon:#A86A12; --panel:#F5F6F7; --hover:#E9ECEF; --guide:#E0356E; --edge:#3A4148;
  --shadow:0 1px 0 rgba(27,32,37,.05),0 8px 20px -10px rgba(27,32,37,.35);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14171A; --card:#1F2328; --ink:#E6E9EC; --muted:#8C96A0; --line:#31373E;
    --accent:#809DFF; --warn:#FF6A5C; --soon:#E2A94B; --panel:#1A1D21; --hover:#262B31; --guide:#FF5C93; --edge:#FFFFFF;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -10px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14171A; --card:#1F2328; --ink:#E6E9EC; --muted:#8C96A0; --line:#31373E;
  --accent:#809DFF; --warn:#FF6A5C; --soon:#E2A94B; --panel:#1A1D21; --hover:#262B31; --guide:#FF5C93; --edge:#FFFFFF;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);overflow:hidden;
  font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{position:relative;height:100%;overflow:hidden}
#canvas{position:absolute;inset:0;touch-action:none;cursor:default}
#canvas.spacepan{cursor:grab}
#canvas.panning{cursor:grabbing}
#marquee{position:absolute;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:2px;pointer-events:none;z-index:4}
#marquee[hidden]{display:none}
#canvas.attaching,#canvas.attaching .node{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke:var(--edge);stroke-width:2.2;stroke-linecap:round}
#edges path.done{stroke-dasharray:3 6;opacity:.55}
#edges circle{stroke:none;fill:var(--edge)}
#guides{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#guides path{fill:none;stroke:var(--guide)}

/* Cards */
.node{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);padding:9px 12px 10px;min-width:120px;width:max-content;user-select:none;-webkit-user-select:none;cursor:default}
.node .head{display:flex;gap:9px;align-items:flex-start}
.node .title{white-space:pre-wrap;overflow-wrap:anywhere;flex:1}
.node .ph{color:var(--muted);font-style:italic}
.node.sel{outline:2px solid var(--accent);outline-offset:3px;z-index:3}
.node.sm1{max-width:170px;min-width:60px;padding:4px 7px 5px;border-radius:7px}.node.sm1 .title{font-size:9.5px;line-height:1.3;font-weight:500}
.node.s0{max-width:190px;min-width:84px;padding:6px 9px 7px;border-radius:8px}.node.s0 .title{font-size:11px;line-height:1.3;font-weight:500}
.node.sm1 .head{gap:5px}.node.s0 .head{gap:7px}
.node.sm1 .chk{width:11px;height:11px;border-width:1.5px;margin-top:0}.node.s0 .chk{width:14px;height:14px;margin-top:0}
.node.sm1 .items,.node.sm1 .meta{font-size:9.5px;margin-top:4px}.node.s0 .items,.node.s0 .meta{font-size:11px;margin-top:6px}
.node.sm1 .due,.node.s0 .due{padding:1px 6px}
.node.sm1 .ichk{width:9px;height:9px;margin-top:1px;border-width:1.2px}.node.s0 .ichk{width:11px;height:11px;margin-top:1px}
.node.sm1 .items{gap:2px}.node.sm1 .items li{gap:5px}
.node.s1{max-width:220px}.node.s1 .title{font-size:13px;line-height:1.3;font-weight:500}
.node.s2{max-width:260px}.node.s2 .title{font-size:16px;line-height:1.3;font-weight:500}
.node.s3{max-width:320px;padding:12px 16px 13px}.node.s3 .title{font-size:24px;line-height:1.15;font-weight:600;letter-spacing:-.01em}
.node.s4{max-width:440px;padding:14px 20px 16px}.node.s4 .title{font-size:38px;line-height:1.02;font-weight:700;letter-spacing:-.025em}
/* a box with a colour is filled with it; --on is white or dark text, whichever reads better */
.node.filled{background:var(--c);border-color:transparent;color:var(--on);border-radius:12px}
.node.filled .ph{color:var(--on);opacity:.7}
.node.filled.done .title{color:var(--on);opacity:.7}
.node.filled .chk,.node.filled .ichk{border-color:var(--on)}
.node.filled.done .chk,.node.filled .ichk.on{background:var(--on)}
.node.filled.done .chk::after,.node.filled .ichk.on::after{border-color:var(--c)}
.node.filled .items li.done span{color:inherit;opacity:.65}
.node.done .title{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.node.done{opacity:.72}
.addh{position:absolute;width:24px;height:24px;border-radius:50%;border:2px solid var(--paper);background:var(--c);color:#fff;padding:0;
  font-size:17px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:1}
.addh:hover{filter:brightness(1.12)}
.addh.r{left:100%;top:50%;margin:-12px 0 0 22px}.addh.l{right:100%;top:50%;margin:-12px 22px 0 0}
.addh.b{top:100%;left:50%;margin:22px 0 0 -12px}.addh.t{bottom:100%;left:50%;margin:0 0 22px -12px}
.fold{position:absolute;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--c);background:var(--card);color:var(--c);padding:0;
  font-size:14px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2}
.fold:hover{transform:scale(1.2)}
.rsz{position:absolute;right:-6px;bottom:-6px;width:11px;height:11px;border-radius:3px;background:var(--card);border:1.5px solid var(--c);cursor:nwse-resize;z-index:2;touch-action:none}
.rsz::after{content:"";position:absolute;inset:-9px}
.lnkh{position:absolute;right:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;border:2px solid var(--paper);
  display:flex;align-items:center;justify-content:center;cursor:crosshair;z-index:2;touch-action:none;box-shadow:var(--shadow)}
.lnkh::after{content:"";position:absolute;inset:-8px}
.lnkh svg{pointer-events:none}
.node.ref::before{content:"Reference";position:absolute;left:0;bottom:calc(100% + 7px);font-size:11px;font-weight:600;color:var(--accent);white-space:nowrap;pointer-events:none}
.algn{display:inline-flex;flex-wrap:wrap;gap:4px}
.algn .btn{border:1px solid var(--line);background:var(--card);height:32px;padding:0 9px;font-size:13px;gap:5px}
.algn .btn:disabled{opacity:.4}
.isoh{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--card);color:var(--ink);border:1.5px solid var(--accent);
  padding:0;display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:var(--shadow)}
.isoh.on,.isoh:hover{background:var(--accent);color:#fff}
.isoh::after{content:"";position:absolute;inset:-8px}
#focusbar{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--accent);
  border-radius:999px;padding:4px 4px 4px 14px;box-shadow:var(--shadow);font-size:13px;max-width:calc(100% - 24px);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
#focusbar[hidden]{display:none}
#focusbar .crumb{border:0;background:transparent;color:var(--muted);padding:3px 4px;border-radius:6px;font-size:13px}
#focusbar .crumb:hover{color:var(--ink);background:var(--hover)}
#focusbar .crumb.cur{color:var(--ink);font-weight:600}
#focusbar .btn{height:28px;background:var(--accent);color:#fff;border-radius:999px;font-size:13px}
.node.droptarget{outline:2px dashed var(--accent);outline-offset:4px}
#guides path.linkline{stroke:var(--accent);stroke-dasharray:6 5;stroke-linecap:round}
.fold.r{left:100%;top:50%;margin:-9px 0 0 -9px}.fold.l{right:100%;top:50%;margin:-9px -9px 0 0}
.fold.b{top:100%;left:50%;margin:-9px 0 0 -9px}.fold.t{bottom:100%;left:50%;margin:0 0 -9px -9px}
.node .title[contenteditable]{user-select:text;-webkit-user-select:text;cursor:text;outline:none;min-width:2ch}
.node .title[contenteditable]:empty::before{content:"Untitled";color:var(--muted);font-style:italic}
.node.filled .title[contenteditable]:empty::before{color:var(--on);opacity:.7}

.chk{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:2px solid var(--c);background:transparent;padding:0;position:relative}
.node.s3 .chk{margin-top:5px}.node.s4 .chk{margin-top:10px;width:22px;height:22px}
.node.done .chk{background:var(--c)}
.node.done .chk::after,.ichk.on::after,.pchk.on::after{content:"";position:absolute;left:50%;top:45%;width:35%;height:60%;
  border:solid #fff;border-width:0 2px 2px 0;transform:translate(-50%,-50%) rotate(45deg)}
.items{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:13px;line-height:1.3}
.items li{display:flex;gap:7px;align-items:flex-start}
.items li.done span{text-decoration:line-through;color:var(--muted)}
.ichk{flex:none;width:13px;height:13px;margin-top:2px;border-radius:3px;border:1.5px solid var(--c);background:transparent;padding:0;position:relative}
.ichk.on{background:var(--c)}
.ichk.on::after{border-width:0 1.5px 1.5px 0}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:8px;font-size:12px}
.due{padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.due.today{border-color:var(--soon);color:var(--soon)}
.due.over{background:var(--warn);border-color:var(--warn);color:#fff}
.node.done .due{background:none;border-color:var(--line);color:var(--muted)}
.prog{color:var(--muted)}
.filled .prog{color:var(--on);opacity:.8}
.filled .due{border-color:var(--on);color:var(--on)}
.lnk{color:var(--accent);text-decoration:underline;text-underline-offset:2px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filled .lnk{color:var(--on)}

/* Chrome */
.bar{position:absolute;display:flex;align-items:center;gap:4px;padding:5px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:5}
#topleft{top:12px;left:12px}
#topright{top:12px;right:12px}
.bar>*{flex:none}
.brand{font-weight:700;font-size:17px;letter-spacing:-.02em;padding:0 8px 0 6px}
#viewSeg button{font-size:14px;font-weight:600;padding:0 11px}
.btn{height:32px;min-width:32px;padding:0 10px;border:0;border-radius:8px;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-size:14px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{opacity:.88;background:var(--ink)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.35;cursor:default;background:transparent}
#bUndo,#bRedo{font-size:20px;font-weight:600;padding:0 6px}
#histlist .hrow{display:flex;gap:10px;align-items:baseline;text-align:left;border:0;background:var(--card);border-radius:8px;padding:9px 10px;width:100%}
#histlist .hrow:hover{background:var(--hover)}
#histlist .hrow .t{flex:1;font-size:14px}
#histlist .hrow .d{font-size:12px;color:var(--muted);white-space:nowrap}
#histlist .hrow.cur{outline:2px solid var(--accent);outline-offset:-2px}
#histlist .hrow.future{opacity:.45}
#histlist .hl{display:grid;gap:4px}
.sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.seg{display:inline-flex;background:var(--hover);border-radius:8px;padding:2px}
.seg button{height:28px;padding:0 9px;border:0;border-radius:6px;background:transparent;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--warn);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.badge[hidden]{display:none}
#zoomlbl{font-size:12px;color:var(--muted);min-width:40px}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sdot.ok{background:#16825A}.sdot.saving,.sdot.loading{background:var(--soon)}.sdot.error{background:var(--warn)}
.btn[hidden]{display:none}

#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--muted);font-size:18px;text-align:center;padding:24px}
#empty[hidden]{display:none}

/* Side panel */
.sheet{position:absolute;top:64px;right:12px;bottom:12px;width:340px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);z-index:6;display:flex;flex-direction:column;overflow:hidden}
.sheet[hidden]{display:none}
.sheet .body{overflow:auto;padding:14px 16px 18px;display:grid;gap:18px}
.sheet .top{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 0 16px;color:var(--muted);font-size:13px}
.field{display:grid;gap:7px}
.field > label,.fl{font-size:13px;color:var(--muted)}
#pTitle{width:100%;resize:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:18px;font-weight:600;line-height:1.25;min-height:48px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp{height:34px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:0 10px;font-size:14px;min-width:0}
.inp.grow{flex:1}
.sw{width:24px;height:24px;border-radius:50%;border:0;background:var(--s);padding:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
.sw.none{background:var(--card);position:relative;overflow:hidden}
.sw.none::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1.5px;background:var(--warn);transform:rotate(45deg)}
.sw.pick{background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);position:relative;cursor:pointer;display:inline-block}
.sw.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.sw.on{outline:2px solid var(--ink);outline-offset:2px}
.plist{display:grid;gap:4px}
.pitem{display:flex;gap:8px;align-items:center}
.pitem .inp{flex:1;height:32px;border-color:transparent;background:transparent;padding:0 6px}
.pitem .inp:hover,.pitem .inp:focus{border-color:var(--line);background:var(--card)}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);user-select:none}
.tog input{appearance:none;-webkit-appearance:none;width:30px;height:18px;border-radius:999px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
.tog input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tog input:checked{background:var(--accent)}.tog input:checked::after{transform:translateX(12px)}
.pchk{flex:none;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--muted);background:transparent;padding:0;position:relative}
.pchk.on{background:var(--ink);border-color:var(--ink)}
.pchk.on::after{border-color:var(--paper)}
.x{flex:none;width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:18px;line-height:1}
.x:hover{background:var(--hover);color:var(--ink)}
.hint{font-size:12px;color:var(--muted);line-height:1.45}
kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--card)}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.actions .btn{border:1px solid var(--line);background:var(--card)}

/* Due list */
#duelist .grp{display:grid;gap:4px}
#duelist .grp h3{margin:0 0 2px;font-size:13px;font-weight:500;color:var(--muted)}
.drow{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:var(--card);border-radius:8px;padding:9px 10px;border-left:4px solid var(--c)}
.drow:hover{background:var(--hover)}
.drow .t{flex:1;font-size:14px}
.drow .d{font-size:12px;color:var(--muted);white-space:nowrap}
.drow.over .d{color:var(--warn)}

/* Modal */
#modal{position:absolute;inset:0;background:rgba(10,12,14,.45);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
#modal[hidden]{display:none}
#modal .box{background:var(--panel);border-radius:14px;padding:18px;width:min(520px,100%);display:grid;gap:12px;max-height:100%;overflow:auto}
#modal h2{margin:0;font-size:20px;letter-spacing:-.01em}
#modal h3{margin:6px 0 0;font-size:15px;font-weight:600}
#syncBox,#presyncBox{display:grid;gap:8px}
#presyncBox[hidden],#syncSec[hidden]{display:none}
#modal textarea{width:100%;height:120px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px;font-size:12px;resize:vertical}

#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:10px;padding:9px 10px 9px 14px;
  display:flex;gap:10px;align-items:center;font-size:14px;z-index:10;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
#toast[hidden]{display:none}
#toast button{border:0;background:rgba(255,255,255,.14);color:inherit;border-radius:6px;padding:4px 10px}

/* ---------- Tasks & Calendar views ---------- */
.viewpane{position:absolute;inset:0;z-index:4;background:var(--paper);overflow:auto;padding:72px 16px 32px}
.viewpane[hidden]{display:none}
body.panel-open .viewpane{padding-right:372px}
body:not([data-view="branches"]) .canvas-only{display:none}
.tl{max-width:760px;margin:0 auto;display:grid;gap:22px}
.tgrp{display:grid;gap:6px}
.tgrp h3{margin:0 0 2px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.tgrp h3.over{color:var(--warn)}
.trow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:10px 10px 10px 12px;cursor:pointer}
.trow:hover{background:var(--hover)}
.trow.sel{outline:2px solid var(--accent);outline-offset:1px}
.trow .tchk{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);background:transparent;padding:0;position:relative}
.trow.done .tchk{background:var(--muted)}
.trow.done .tchk::after{content:"";position:absolute;left:50%;top:45%;width:35%;height:60%;border:solid #fff;border-width:0 2px 2px 0;transform:translate(-50%,-50%) rotate(45deg)}
.trow .tm{flex:1;min-width:0}
.trow .tt{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.trow.done .tt{text-decoration:line-through;color:var(--muted)}
.trow .ts{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tw{font-size:12px;color:var(--muted);white-space:nowrap}
.trow .tw.over{color:var(--warn)}.trow .tw.today{color:var(--soon)}
.trow .tgo{flex:none;border:0;background:transparent;color:var(--muted);border-radius:6px;width:30px;height:30px;font-size:15px}
.trow .tgo:hover{background:var(--panel);color:var(--ink)}
/* rows of coloured boxes are filled with the box colour, like on the board */
.trow.filled{background:var(--c);border-color:transparent;color:var(--on)}
.trow.filled:hover{background:var(--c);filter:brightness(1.08)}
.trow.filled .ts,.trow.filled .tw,.trow.filled .tgo{color:var(--on);opacity:.8}

    <button class="btn" id="bDue">Due <span class="badge" id="dueBadge" hidden>0</span></button>
    <span class="sep canvas-only"></span>

<script>
(() => {
const COLORS=['#2E57E6','#CF3429','#16825A','#B26B0E','#7440D0','#0E8398','#C0327F','#4A5462',
  '#F76B15','#FFC53D','#FFE629','#99D52A','#30A46C','#7CE2FE','#F4A4C0','#FFFFFF'];
const KEY='branches.v1';
/* Firebase web config (public by design; the Firestore rules keep each board private). null = sync off */
const FIREBASE_CONFIG={
  apiKey:'AIzaSyCfUtnyeITPz98iVj4E9deEwOYhTHdNfOI',
  authDomain:'branches-f3238.firebaseapp.com',
  projectId:'branches-f3238',
  storageBucket:'branches-f3238.firebasestorage.app',
  messagingSenderId:'522153718678',
  appId:'1:522153718678:web:05ce4e50f6527591b163b7'
};
const $=s=>document.querySelector(s);
const canvas=$('#canvas'), world=$('#world'), edges=$('#edges'), nodesEl=$('#nodes');
const panel=$('#panel'), duelist=$('#duelist');
let S={nodes:{},view:{x:0,y:0,k:1}};
let sel=null, msel=new Set(), moveMode='branch', attachFrom=null, elMap={}, view='branches';

const uid=()=>Math.random().toString(36).slice(2,10);
const N=id=>S.nodes[id];
const all=()=>Object.values(S.nodes);
const kids=id=>all().filter(n=>n.parent===id);
function hiddenNode(id){let n=N(id),guard=0;while(n&&n.parent&&guard++<999){n=N(n.parent);if(n&&n.collapsed)return true}return false}
/* isolate: show only one box and what branches from it. focusStack holds the nested isolated boxes (this device only) */
let focusStack=[],viewBeforeFocus=null;
const focusId=()=>focusStack[focusStack.length-1]||null;
function inFocus(id){const f=focusId();if(!f)return true;let n=N(id),g=0;while(n&&g++<999){if(n.id===f)return true;n=n.parent&&N(n.parent)}return false}
const visible=()=>all().filter(n=>!hiddenNode(n.id)&&inFocus(n.id));
function reveal(id){let n=N(id),guard=0;while(n&&n.parent&&guard++<999){n=N(n.parent);if(n)delete n.collapsed}}
function desc(id){const out=[],st=[id];while(st.length){const c=st.pop();for(const k of kids(c)){out.push(k.id);st.push(k.id)}}return out}
// a box shows a tick-box only when it's a task (older boxes that are already ticked count as tasks)
const isTask=n=>!!n&&(n.task===true||(n.task===undefined&&n.done===true));
/* ---------- repeating tasks ----------
   n.repeat = {every:N, unit:'day'|'week'|'month'|'year', days:[0-6] (weeks: which weekdays, 0=Sun),
               dom (month/year: day of month to keep), anchor ('YYYY-MM-DD', counts the N-week cycle), from:'done' (count from tick date)} */
const WD=[1,2,3,4,5,6,0];  // Monday first
function nextDue(n,forceFromDue){
  const r=n.repeat,t=parseDue(n.due);if(!r||!t||isNaN(t))return null;
  const time=n.due.includes('T')?'T'+n.due.split('T')[1]:'',k=Math.max(1,parseInt(r.every)||1);
  const b0=r.from==='done'&&!forceFromDue?new Date():t,base=new Date(b0.getFullYear(),b0.getMonth(),b0.getDate());
  const kd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const plus=(d,x)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+x);
  let d=null;
  if(r.unit==='day')d=plus(base,k);
  else if(r.unit==='week'){
    const days=r.days&&r.days.length?r.days:[t.getDay()];
    const [ay,am,ad]=(r.anchor||kd(t)).split('-').map(Number),an=new Date(ay,am-1,ad),anMon=plus(an,-((an.getDay()+6)%7));
    for(let i=1;i<=7*k+7;i++){const c=plus(base,i),mon=plus(c,-((c.getDay()+6)%7)),wk=Math.round((mon-anMon)/6048e5);
      if(days.includes(c.getDay())&&((wk%k)+k)%k===0){d=c;break}}
  }else if(r.unit==='month'||r.unit==='year'){
    const m=r.unit==='month'?k:12*k,dom=r.dom||t.getDate(),y=base.getFullYear(),mo=base.getMonth()+m;
    d=new Date(y,mo,Math.min(dom,new Date(y,mo+1,0).getDate()));
  }
  return d?kd(d)+time:null;
}
function repeatText(r){
  if(!r)return '';const k=Math.max(1,parseInt(r.every)||1),pl=(w)=>k>1?`${k} ${w}s`:w;
  const names=(r.days||[]).slice().sort((a,b)=>WD.indexOf(a)-WD.indexOf(b)).map(i=>new Date(2024,0,7+i).toLocaleDateString(undefined,{weekday:'short'}));
  let t=r.unit==='day'?(k>1?`Every ${k} days`:'Every day'):r.unit==='week'?`Every ${pl('week')}${names.length?' on '+names.join(', '):''}`:
    r.unit==='month'?`Every ${pl('month')}${r.dom?' on day '+r.dom:''}`:`Every ${pl('year')}`;
  return t+(r.from==='done'?', counted from when ticked':'');
}
/* ---------- email reminders ----------
   n.notify = {to:[emails], days:[days before due], sent:{'<due>|<days>': ISO time}} — sent by the daily GitHub Action
   (scripts/send-reminders.mjs), which marks what it sent so nothing goes out twice. */
const EMAIL_RE=/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/;
const parseEmails=t=>[...new Set(String(t||'').split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(Boolean))];
const parseDays=t=>[...new Set(String(t||'').split(/[\s,;]+/).map(x=>parseInt(x)).filter(x=>x>=0&&x<=365))].sort((a,b)=>b-a);
function notifyText(n){
  const f=n.notify;if(!f)return '';
  const ds=(f.days||[]).map(d=>d===0?'on the day':d===1?'1 day before':`${d} days before`);
  return `Email to ${(f.to||[]).length} recipient${(f.to||[]).length===1?'':'s'}${ds.length?', '+ds.join(', '):''}`;
}
function nextEmail(n){  // the next email the daily job would send, as {date, days}
  const f=n.notify,t=parseDue(n.due);if(!f||!t||isNaN(t)||n.done||!(f.to||[]).length)return null;
  const today=new Date();today.setHours(0,0,0,0);const due=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  if(due<today)return null;
  const opts=(f.days||[]).filter(d=>!(f.sent||{})[n.due+'|'+d]).map(d=>({d,date:new Date(due.getFullYear(),due.getMonth(),due.getDate()-d)})).sort((a,b)=>a.date-b.date);
  if(!opts.length)return null;
  // a reminder day that has already passed goes out at the next daily run
  return opts[0].date<today?{d:opts[0].d,date:today,catchup:true}:opts[0];
}
// tick a box: a repeating task rolls on to its next date instead of staying done
function toggleDone(n){
  if(n.repeat&&!n.done){
    const nd=nextDue(n);
    if(nd){n.due=nd;n.alerted=null;n.task=true;n.lastDone=new Date().toISOString().slice(0,10);(n.items||[]).forEach(i=>i.done=false);
      const lbl=dueInfo(nd).label;nextLabel=`Done “${(n.title||'Untitled').slice(0,30)}”, next ${lbl}`;toast(`Done. Next: ${lbl}`);return}
  }
  n.done=!n.done;
}
const colorOf=id=>(N(id)&&N(id).color)||'';
// white or dark text on a coloured box, by perceived brightness
function onColor(hex){const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return '#fff';const v=parseInt(m[1],16),r=v>>16,g=v>>8&255,b=v&255;
  return (0.299*r+0.587*g+0.114*b)>165?'#1B2025':'#fff'}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeUrl(u){u=(u||'').trim();if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;return /^(https?|mailto):/i.test(u)?u:'#'}
function host(u){try{return new URL(safeUrl(u)).hostname.replace(/^www\./,'')||u}catch(e){return u}}

/* ---------- storage ---------- */
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.nodes){S=d;S.view=S.view||{x:0,y:0,k:1};return true}}}catch(e){}return false}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},200);queuePush();queueCheckpoint()}

/* ---------- dates ---------- */
function parseDue(d){if(!d)return null;const [ds,ts]=d.split('T');const [y,m,dd]=ds.split('-').map(Number);if(!y)return null;
  let h=0,mi=0;if(ts){[h,mi]=ts.split(':').map(Number)}return new Date(y,m-1,dd,h||0,mi||0)}
function dueInfo(d){const t=parseDue(d);if(!t||isNaN(t))return null;const hasTime=d.includes('T');
  const now=new Date(),sod=new Date(now.getFullYear(),now.getMonth(),now.getDate()),tom=new Date(sod.getTime()+864e5);
  let cls='later';if(hasTime?t<now:t<sod)cls='over';else if(t<tom)cls='today';
  const day=(t>=sod&&t<tom)?'Today':(t>=tom&&t<new Date(tom.getTime()+864e5))?'Tomorrow':t.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const time=hasTime?' '+t.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}):'';
  return {cls,label:day+time,t,hasTime}}

/* ---------- seed ---------- */
function seed(){
  const d=n=>{const t=new Date(Date.now()+n*864e5);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
  const mk=(o)=>{const id=uid();S.nodes[id]={id,parent:null,x:0,y:0,title:'',size:2,done:false,due:'',items:[],links:[],...o};return id};
  const it=(t,done=false)=>({id:uid(),text:t,done});
  const a=mk({title:'Client work',size:3,color:COLORS[0],x:60,y:150});
  mk({parent:a,title:'Update portfolio',x:360,y:40,items:[it('Pick six hero projects',true),it('Rewrite case study intros'),it('Check the mobile layout')]});
  mk({parent:a,title:'Send September invoice',x:360,y:215,due:d(2)});
  mk({parent:a,title:'Pitch deck references',size:1,x:360,y:300,links:[{url:'https://www.behance.net',label:''}]});
  const b=mk({title:'Art practice',size:4,color:COLORS[2],x:60,y:470});
  const p=mk({parent:b,title:'Portrait series',x:430,y:430});
  mk({parent:p,title:'Buy 2B–8B pencils',size:1,x:720,y:410,done:true});
  mk({parent:p,title:'Book a model for Saturday',size:1,x:720,y:470,due:d(4)+'T10:00'});
  mk({parent:b,title:'Film a drawing timelapse',x:430,y:540,due:d(0)});
  const c=mk({title:'Home',size:3,color:COLORS[3],x:60,y:720});
  mk({parent:c,title:'Car service',x:260,y:722,due:d(1)+'T09:30'});
}

/* ---------- render ---------- */
// text sizes: -1 XXS, 0 XS, 1 S, 2 M (default), 3 L, 4 XL
const SIZES=[[-1,'XXS'],[0,'XS'],[1,'S'],[2,'M'],[3,'L'],[4,'XL']];
const sizeOf=n=>n.size??2;
const szClass=n=>{const v=sizeOf(n);return v<0?'sm'+(-v):'s'+v};
function cardHTML(n){
  const col=n.color||'';
  const items=(n.items||[]).map(i=>`<li class="${i.done?'done':''}"><button class="ichk ${i.done?'on':''}" data-act="item" data-item="${i.id}" aria-label="Toggle item"></button><span>${esc(i.text)||'&nbsp;'}</span></li>`).join('');
  const di=dueInfo(n.due);
  const links=(n.links||[]).map(l=>`<a class="lnk" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.label||host(l.url))}</a>`).join('');
  let prog='';
  const d=desc(n.id).map(N).filter(isTask);if(d.length)prog=`<span class="prog">${d.filter(x=>x.done).length} of ${d.length} done</span>`;
  if(n.items&&n.items.length)prog+=`<span class="prog">${n.items.filter(i=>i.done).length}/${n.items.length}</span>`;
  const rp=(n.repeat?`<span class="rep" title="${esc(repeatText(n.repeat))}">↻</span>`:'')+(n.notify&&(n.notify.to||[]).length?`<span class="rep" title="${esc(notifyText(n))}">✉</span>`:'');

function foldHTML(n){

// render without pushing stacked boxes (undo/redo, changes from another device, and flows that place boxes themselves)

/* which side of parent p the branch n leaves from: n.side if set (by the + buttons or a drag), else left/right,

function gaps(p,n){
  const pe=elMap[p.id],ce=elMap[n.id],pw=pe?pe.offsetWidth:200,ph=pe?pe.offsetHeight:44,cw=ce?ce.offsetWidth:160,ch=ce?ce.offsetHeight:44;
  const dx=(n.x+cw/2)-(p.x+pw/2),dy=(n.y+ch/2)-(p.y+ph/2);

function sideOf(p,n){

function drawEdges(){
  const out=[];

    const p=n.parent&&N(n.parent);if(!p)continue;
    const pe=elMap[p.id],ce=elMap[n.id];if(!pe||!ce)continue;
    const pw=pe.offsetWidth,ph=pe.offsetHeight,cw=ce.offsetWidth,chh=ce.offsetHeight,side=sideOf(p,n);
    let d,x2,y2;
    if(side==='t'||side==='b'){
      const down=side==='b',x1=p.x+pw/2,y1=down?p.y+ph:p.y;x2=n.x+cw/2;y2=down?n.y:n.y+chh;
      const dy=Math.max(28,Math.abs(y2-y1)/2)*(down?1:-1);
      d=`M${x1},${y1} C${x1},${y1+dy} ${x2},${y2-dy} ${x2},${y2}`;
    }else{
      const right=side==='r',x1=right?p.x+pw:p.x,y1=p.y+ph/2;x2=right?n.x:n.x+cw;y2=n.y+chh/2;
      const dx=Math.max(28,Math.abs(x2-x1)/2)*(right?1:-1);

function applyView(){

function zoomAt(cx,cy,f){
  const r=canvas.getBoundingClientRect(),v=S.view,k2=Math.min(2.5,Math.max(.2,v.k*f));
  const px=cx-r.left,py=cy-r.top;v.x=px-(px-v.x)*(k2/v.k);v.y=py-(py-v.y)*(k2/v.k);v.k=k2;applyView();save();
}
function fit(){
  const ns=visible();if(!ns.length){S.view={x:0,y:0,k:1};applyView();return}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const n of ns){const e=elMap[n.id];const w=e?e.offsetWidth:200,h=e?e.offsetHeight:50;x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+w);y1=Math.max(y1,n.y+h)}
  const r=canvas.getBoundingClientRect(),small=r.width<720;
  const top=small?110:70,side=small?16:40;
  const W=r.width-(!small&&!panel.hidden?370:0);  // leave room for the side panel
  const k=Math.min(1.2,Math.max(.2,Math.min((W-side*2)/(x1-x0),(r.height-top-30)/(y1-y0))));
  S.view={k,x:(W-(x1-x0)*k)/2-x0*k,y:top+((r.height-top-30)-(y1-y0)*k)/2-y0*k};applyView();save();

  const sx=n.x*v.k+v.x,sy=n.y*v.k+v.y,w=e.offsetWidth*v.k,h=e.offsetHeight*v.k;
  const small=r.width<720,rightLimit=small?r.width:r.width-370,bottomLimit=small?r.height*.4:r.height;

/* ---------- node ops ---------- */
function create(o){

}
function height(id){return elMap[id]?elMap[id].offsetHeight:44}
function addChild(pid){
  const p=N(pid);const pw=elMap[pid]?elMap[pid].offsetWidth:200;

  if(ks.length){const side=ks.filter(k=>k.x>=p.x);const base=side.length?side:ks;let maxB=-1e9;
    for(const k of base){const b=k.y+height(k.id);if(b>maxB){maxB=b;x=k.x}}y=maxB+16}

}
function addChildDir(pid,dir){

  const p=N(pid),pw=elMap[pid]?elMap[pid].offsetWidth:200,ph=height(pid);
  const size=2;

  let x,y,alignRight=null,alignBottom=null;
  if(dir==='l'){
    if(row.length){const last=row.reduce((a,k)=>k.y+height(k.id)>a.y+height(a.id)?k:a);y=last.y+height(last.id)+16;alignRight=last.x+w(last)}
    else{y=p.y;alignRight=p.x-90}
    x=alignRight-160;
  }else{
    if(row.length){const last=row.reduce((a,k)=>k.x+w(k)>a.x+w(a)?k:a);x=last.x+w(last)+16;
      if(dir==='b')y=last.y;else alignBottom=last.y+height(last.id)}

  render();  // measure the new card, then line it up against the side it grew from
  const n=N(id),el=elMap[id];

    return create({x:n.x,y:maxB+60,size:n.size,...(n.color?{color:n.color}:{})})}

  for(const s of sibs)maxB=Math.max(maxB,s.y+height(s.id));

  const moved=all().filter(k=>!gone.has(k.id)&&gone.has(k.parent));

panel.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(msel.size>1){
    const ns=[...msel].map(N).filter(Boolean);
    if(a==='close'){deselect();return}
    const fp=['malign','mdist','mmatch','msize','mresetsize'].includes(a)?followPlan(ns.map(n=>n.id)):null;
    if(a==='mdelete'){delMany([...msel]);return}
    if(a==='msize')ns.forEach(n=>n.size=+b.dataset.v);
    else if(a==='mresetsize')ns.forEach(n=>{delete n.w;delete n.h});
    else if(a==='malign'){
      // line the others up with the reference (the first selected box)
      const R=rectOf(ns[0].id),v=b.dataset.v;
      for(const n of ns.slice(1)){const r=rectOf(n.id);
        if(v==='left')n.x=R.x;else if(v==='right')n.x=Math.round(R.x+R.w-r.w);else if(v==='hcenter')n.x=Math.round(R.x+R.w/2-r.w/2);
        else if(v==='top')n.y=R.y;else if(v==='bottom')n.y=Math.round(R.y+R.h-r.h);else if(v==='vcenter')n.y=Math.round(R.y+R.h/2-r.h/2)}
      ns.forEach(n=>{updateSide(n.id);kids(n.id).forEach(k=>updateSide(k.id))});
      nextLabel=`Aligned ${ns.length} boxes ${{left:'left',right:'right',hcenter:'to the centre',top:'to the top',bottom:'to the bottom',vcenter:'to the middle'}[v]}`;
    }
    else if(a==='mdist'){
      // equal gaps between boxes; the two outer boxes stay where they are
      const hz=b.dataset.v==='h',rs=ns.map(n=>({n,r:rectOf(n.id)})).sort((p,q)=>hz?p.r.x-q.r.x:p.r.y-q.r.y);
      const first=rs[0].r,last=rs[rs.length-1].r,span=hz?last.x+last.w-first.x:last.y+last.h-first.y;
      let gap=(span-rs.reduce((t,x)=>t+(hz?x.r.w:x.r.h),0))/(rs.length-1);
      if(gap<16)gap=24;  // boxes overlapping: spread them out from the first one instead
      let pos=hz?first.x:first.y;
      for(const x of rs){if(hz)x.n.x=Math.round(pos);else x.n.y=Math.round(pos);pos+=(hz?x.r.w:x.r.h)+gap}
      ns.forEach(n=>{updateSide(n.id);kids(n.id).forEach(k=>updateSide(k.id))});
      nextLabel=`Distributed ${ns.length} boxes ${hz?'horizontally':'vertically'}`;
    }
    else if(a==='mmatch'){
      const ref=ns[0],re=elMap[ref.id];if(!re)return;
      const w=re.offsetWidth,h=re.offsetHeight;
      ns.slice(1).forEach(n=>{n.w=w;n.h=h});
      nextLabel=`Matched ${ns.length-1} box${ns.length>2?'es':''} to “${(ref.title||'Untitled').slice(0,30)}”`;
    }
    else if(a==='mcolor')ns.forEach(n=>{if(b.dataset.v)n.color=b.dataset.v;else delete n.color});
    else if(a==='mlink'){attachFrom=ns.map(n=>n.id);canvas.classList.add('attaching');if(view!=='branches')setView('branches');toast(`Tap the box to link these ${ns.length} under, or empty space to cancel`);return}
    else if(a==='munlink'){const set=new Set(ns.map(n=>n.id));ns.forEach(n=>{if(n.parent&&!set.has(n.parent)){n.parent=null;delete n.side}});nextLabel=`Unlinked ${ns.length} boxes`;toast('Unlinked')}
    else if(a==='mtask')ns.forEach(n=>n.task=true);
    else if(a==='mnotask')ns.forEach(n=>{n.task=false;n.done=false});
    else if(a==='mdone')ns.forEach(n=>{n.task=true;if(n.repeat)toggleDone(n);else n.done=true});
    else if(a==='mundone')ns.forEach(n=>n.done=false);
    if(fp){renderQuiet();applyFollow(fp)}
    render();renderPanel();save();return;
  }
  const n=N(sel);if(!n)return;
  if(a==='close')deselect();
  else if(a==='size'||a==='resetSize'){
    const fp=followPlan([n.id]);
    if(a==='size'){n.size=+b.dataset.v;delete n._new}else{delete n.w;delete n.h}
    renderQuiet();applyFollow(fp);render();renderPanel();save()}
  else if(a==='color'){if(b.dataset.v)n.color=b.dataset.v;else delete n.color;render();renderPanel();save()}
  else if(a==='repday'){const r=n.repeat,v=+b.dataset.v,ds=new Set(r.days||[]);ds.has(v)?ds.delete(v):ds.add(v);if(ds.size)r.days=[...ds];render();renderPanel();save()}
  else if(a==='toggleDone'){toggleDone(n);render();renderPanel();save()}
  else if(a==='clearDue'){n.due='';delete n.repeat;render();renderPanel();save()}
  else if(a==='pitem'){const i=n.items.find(i=>i.id===b.dataset.item);i.done=!i.done;render();renderPanel();save()}
  else if(a==='delitem'){n.items=n.items.filter(i=>i.id!==b.dataset.item);render();renderPanel();save()}
  else if(a==='dellink'){n.links.splice(+b.dataset.i,1);render();renderPanel();save()}
  else if(a==='addChild')select(addChild(sel),true);
  else if(a==='addSibling')select(addSibling(sel),true);
  else if(a==='isolate'){if(view!=='branches')setView('branches');if(focusId()===n.id)exitFocus(focusStack.length-1);else isolate(n.id)}
  else if(a==='attach'){attachFrom=sel;canvas.classList.add('attaching');toast('Tap the box to link it under, or empty space to cancel')}
  else if(a==='detach'){n.parent=null;delete n.side;render();renderPanel();save();toast('Unlinked')}
  else if(a==='delete')del(sel);
});
// link one box, or several, under `target`. With several, only the top-most selected boxes are relinked,
// so a selected box that hangs under another selected box keeps its place in that branch.
function doAttach(target){
  const from=[].concat(attachFrom).filter(N);attachFrom=null;canvas.classList.remove('attaching');
  if(!target){toast('Link cancelled');return}
  const set=new Set(from),tops=from.filter(id=>{let p=N(id).parent,g=0;while(p&&g++<999){if(set.has(p))return false;p=N(p)&&N(p).parent}return true});
  const ok=tops.filter(id=>id!==target&&!desc(id).includes(target)),bad=tops.length-ok.length;
  if(!ok.length){toast(tops.length>1?'None of these can go under that box: it’s one of their branches':'A box can’t go under its own branch');return}
  const todo=ok.filter(id=>N(id).parent!==target);
  if(!todo.length){toast('Already linked there');return}
  todo.forEach(id=>{const n=N(id);n.parent=target;delete n.side});delete N(target).collapsed;
  if(todo.length>1)nextLabel=`Linked ${todo.length} boxes under “${(N(target).title||'Untitled').slice(0,30)}”`;
  render();renderPanel();save();
  toast((todo.length>1?`Linked ${todo.length} boxes`:'Linked')+(bad?` (${bad} skipped: the target is one of their branches)`:''));
}

let editing=null,editEl=null,editOrig='',renderLater=false,lastTap={};
function startEdit(id){
  const n=N(id),el=elMap[id]&&elMap[id].querySelector('.title');if(!n||!el)return;
  editing=id;editEl=el;editOrig=n.title||'';renderLater=false;

const pts=new Map();let g=null;
canvas.addEventListener('pointerdown',e=>{
  if(e.target.closest('[contenteditable]'))return;
  if(editing)finishEdit();
  if(e.target.closest('button,a'))return;
  const lk=e.target.closest('.lnkh');
  if(lk&&pts.size===0){
    const id=lk.closest('.node').dataset.id;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{canvas.setPointerCapture(e.pointerId)}catch(_){}
    const ids=msel.size>1&&msel.has(id)?[...msel]:[id];
    g={type:'link',id,ids,sx:e.clientX,sy:e.clientY,moved:false,over:null};return;
  }
  const rz=e.target.closest('.rsz');
  if(rz&&pts.size===0){
    const id=rz.closest('.node').dataset.id,el=elMap[id];
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{canvas.setPointerCapture(e.pointerId)}catch(_){}
    // with several boxes selected, every one of them resizes by the same amount
    const group=msel.size>1&&msel.has(id)?[...msel].filter(i=>i!==id&&elMap[i]).map(i=>({id:i,ow:elMap[i].offsetWidth,oh:elMap[i].offsetHeight})):[];
    const srcs=[id,...group.map(o=>o.id)].map(i=>{const r=rectOf(i);return {id:i,ox:r.x,oy:r.y,ow:r.w,oh:r.h}});
    g={type:'resize',id,group,srcs,fp:followPlan(srcs.map(o=>o.id)),sx:e.clientX,sy:e.clientY,ow:el.offsetWidth,oh:el.offsetHeight,moved:false};return;
  }
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  if(pts.size===2){const [a,b]=[...pts.values()];g={type:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};return}
  if(pts.size>2)return;
  const ne=e.target.closest('.node');
  if(ne){
    const id=ne.dataset.id;
    if(attachFrom){g={type:'attach',id:[].concat(attachFrom).includes(id)?null:id};return}
    const base=msel.has(id)?[...msel]:[id];  // dragging a selected card moves the whole selection
    const ids=[...new Set(base.flatMap(i=>moveMode==='branch'?[i,...desc(i)]:[i]))];
    g={type:'drag',id,base,shift:e.shiftKey,sx:e.clientX,sy:e.clientY,orig:ids.map(i=>[i,N(i).x,N(i).y]),moved:false};
  }else{
    // mouse drag on empty space draws a selection box; touch, middle button or Space+drag pans
    if(e.pointerType==='mouse'&&e.button===0&&!spaceDown&&!attachFrom){
      const base=new Set(e.shiftKey?(msel.size?msel:sel?[sel]:[]):[]);
      g={type:'marquee',sx:e.clientX,sy:e.clientY,base,moved:false};
    }else g={type:'pan',sx:e.clientX,sy:e.clientY,vx:S.view.x,vy:S.view.y,moved:false};
  }
});
/* ---------- keeping the layout when a box changes size or moves ----------
   Followers of a box: its own branches below it (follow its bottom edge) or to its right (follow its right edge),
   whatever the distance, plus unconnected boxes stacked directly under it (and, in Branch mode, their branches). */
const STACK_GAP=96;
function rectWith(i,H,W){const r=rectOf(i);if(H&&H[i]!=null)r.h=H[i];if(W&&W[i]!=null)r.w=W[i];return r}
// boxes under `src`: overlapping it horizontally, starting below its top, at most STACK_GAP below its bottom (overlaps count)
function stackUnder(src,skip,H,W){
  const rs=Object.keys(elMap).filter(i=>!skip.has(i)).map(i=>({id:i,...rectWith(i,H,W)}));
  const out=new Set(),q=[src];
  while(q.length){const a=rectWith(q.shift(),H,W);
    for(const b of rs){if(out.has(b.id)||b.id===src)continue;
      if(b.x<a.x+a.w-4&&a.x<b.x+b.w-4&&b.y>=a.y+8&&b.y-(a.y+a.h)<=STACK_GAP){out.add(b.id);q.push(b.id)}}}
  return out;
}
// boxes to the right of `src` in the same row: overlapping it vertically, starting right of its left edge,
// at most STACK_GAP beyond its right edge (overlaps count)
function rowRight(src,skip,H,W){
  const rs=Object.keys(elMap).filter(i=>!skip.has(i)).map(i=>({id:i,...rectWith(i,H,W)}));
  const out=new Set(),q=[src];
  while(q.length){const a=rectWith(q.shift(),H,W);
    for(const b of rs){if(out.has(b.id)||b.id===src)continue;
      if(b.y<a.y+a.h-4&&a.y<b.y+b.h-4&&b.x>=a.x+8&&b.x-(a.x+a.w)<=STACK_GAP){out.add(b.id);q.push(b.id)}}}
  return out;
}
// Map follower id -> [x edge it follows ('left'|'right'), y edge it follows ('top'|'bottom')]
function followersOf(s,skip,H,W){
  const out=new Map(),r=rectWith(s,H,W),bottom=r.y+r.h,right=r.x+r.w;
  const add=(i,xm,ym)=>{if(i!==s&&!skip.has(i)&&!out.has(i)&&N(i))out.set(i,[xm,ym])};
  for(const d of desc(s)){const q=rectWith(d,H,W),below=q.y>=bottom-4,ro=q.x>=right-4;if(below||ro)add(d,ro?'right':'left',below?'bottom':'top')}
  const st=stackUnder(s,skip,H,W);st.forEach(i=>add(i,'left','bottom'));
  if(moveMode==='branch')st.forEach(i=>desc(i).forEach(d=>add(d,'left','bottom')));
  const rw=rowRight(s,skip,H,W);rw.forEach(i=>add(i,'right','top'));
  rw.forEach(i=>desc(i).forEach(d=>add(d,'right','top')));  // a box pushed aside takes its branches with it
  return out;
}
// before changing boxes `srcs`: note their followers and where everything was
function followPlan(srcs){
  const skip=new Set(srcs),plan=new Map();
  for(const s of srcs)for(const [i,m] of followersOf(s,skip))if(!plan.has(i))plan.set(i,{s,ox:N(i).x,oy:N(i).y,m});
  const base=Object.fromEntries(srcs.map(s=>{const r=rectOf(s);return [s,{x:r.x,y:r.y,r:r.x+r.w,b:r.y+r.h}]}));
  return {plan,base};
}
// after the change: move each follower by the shift of the edge it follows
function applyFollow(fp){
  for(const [i,{s,ox,oy,m}] of fp.plan){
    const n=N(i),b=fp.base[s];if(!n||!N(s))continue;const r=rectOf(s);
    n.x=Math.round(ox+(m[0]==='right'?r.x+r.w-b.r:r.x-b.x));n.y=Math.round(oy+(m[1]==='bottom'?r.y+r.h-b.b:r.y-b.y));
    const el=elMap[i];if(el){el.style.left=n.x+'px';el.style.top=n.y+'px'}
  }
  fp.plan.forEach((_,i)=>updateSide(i));
}
// after a render: boxes whose size changed (typing, checklist, text size...) push their followers; found with the old sizes
function autoFollow(prevH,prevW){
  const changed=Object.keys(prevH).filter(id=>elMap[id]&&(Math.abs(elMap[id].offsetHeight-prevH[id])>1||Math.abs(elMap[id].offsetWidth-prevW[id])>1));
  if(!changed.length)return;
  const shift=new Map();
  for(const s of changed){
    const dh=elMap[s].offsetHeight-prevH[s],dw=elMap[s].offsetWidth-prevW[s];
    for(const [i,[xm,ym]] of followersOf(s,new Set([s]),prevH,prevW)){
      const d=shift.get(i)||[0,0];if(xm==='right')d[0]+=dw;if(ym==='bottom')d[1]+=dh;shift.set(i,d);
    }
  }
  for(const [i,[dx,dy]] of shift){if(!dx&&!dy)continue;const n=N(i);if(!n)continue;n.x=Math.round(n.x+dx);n.y=Math.round(n.y+dy);const el=elMap[i];if(el){el.style.left=n.x+'px';el.style.top=n.y+'px'}}
}

/* ---------- snapping while dragging: edges, centres and matching gaps (hold Alt/Option to place freely) ---------- */
const guidesEl=$('#guides');
function rectOf(id){const n=N(id),e=elMap[id];return {x:n.x,y:n.y,w:e?e.offsetWidth:160,h:e?e.offsetHeight:44}}
const flip=r=>({x:r.y,y:r.x,w:r.h,h:r.w});
// neighbouring side-by-side pairs of cards and the gap between them (x axis; call with flipped rects for y)
function gapPairs(refs){
  const out=[];
  for(const a of refs){let best=null;
    for(const b of refs){if(b===a||!(a.y<b.y+b.h&&b.y<a.y+a.h))continue;const d=b.x-(a.x+a.w);if(d>0&&d<600&&(!best||d<best.d))best={d,a,b}}
    if(best)out.push(best)}
  return out;
}
function snapPrep(moving,id){
  const refs=Object.keys(elMap).filter(i=>!moving.has(i)).map(rectOf),fl=refs.map(flip);
  return {me:rectOf(id),refs,fl,px:gapPairs(refs),py:gapPairs(fl)};
}
// best x adjustment within T for rect r; returns {d, segs(finalRect)} with segments as [x1,y1,x2,y2]
function snapX(r,refs,pairs,T){
  let best=null;const take=(d,segs)=>{if(Math.abs(d)<=T&&(!best||Math.abs(d)<Math.abs(best.d)-.01))best={d,segs}};
  const lines=f=>[f.x,f.x+f.w/2,f.x+f.w];
  for(const f of refs)for(const a of lines(f))for(const m of [0,r.w/2,r.w])take(a-(r.x+m),fr=>{
    const hit=refs.filter(o=>lines(o).some(v=>Math.abs(v-a)<.6));
    const ys=[fr.y,fr.y+fr.h,...hit.flatMap(o=>[o.y,o.y+o.h])];
    return [[a,Math.min(...ys)-8,a,Math.max(...ys)+8]];
  });
  const ov=f=>f.y<r.y+r.h&&r.y<f.y+f.h,cx=r.x+r.w/2;let L=null,R=null;
  for(const f of refs){if(!ov(f))continue;
    if(f.x+f.w<=cx&&(!L||f.x+f.w>L.x+L.w))L=f;
    if(f.x>=cx&&(!R||f.x<R.x))R=f}
  const mid=(a,b)=>(Math.max(a.y,b.y)+Math.min(a.y+a.h,b.y+b.h))/2;
  const gapSegs=(d,fr)=>{
    const segs=[];
    if(L&&Math.abs(fr.x-(L.x+L.w)-d)<1)segs.push([L.x+L.w,mid(L,fr),fr.x,mid(L,fr)]);
    if(R&&Math.abs(R.x-(fr.x+fr.w)-d)<1)segs.push([fr.x+fr.w,mid(R,fr),R.x,mid(R,fr)]);
    for(const p of pairs)if(Math.abs(p.d-d)<1)segs.push([p.a.x+p.a.w,mid(p.a,p.b),p.b.x,mid(p.a,p.b)]);
    return segs.flatMap(([x1,y,x2])=>[[x1,y,x2,y],[x1,y-4,x1,y+4],[x2,y-4,x2,y+4]]);
  };
  for(const p of pairs){
    if(L)take(L.x+L.w+p.d-r.x,fr=>gapSegs(p.d,fr));
    if(R)take(R.x-p.d-(r.x+r.w),fr=>gapSegs(p.d,fr));
  }
  if(L&&R){const x=(L.x+L.w+R.x-r.w)/2,d=x-(L.x+L.w);if(d>0)take(x-r.x,fr=>gapSegs(d,fr))}
  return best;
}
function drawGuides(segs){
  const k=S.view.k;
  guidesEl.innerHTML=segs.length?`<path stroke-width="${1.2/k}" d="${segs.map(([a,b,c,d])=>`M${a},${b}L${c},${d}`).join('')}"/>`:'';
}

canvas.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)||!g)return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(g.type==='pinch'&&pts.size===2){
    const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    zoomAt(mx,my,d/g.d);S.view.x+=mx-g.mx;S.view.y+=my-g.my;applyView();g.d=d;g.mx=mx;g.my=my;return;
  }
  const dx=e.clientX-g.sx,dy=e.clientY-g.sy;
  if(!g.moved&&Math.hypot(dx,dy)<4)return;g.moved=true;
  if(g.type==='pan'){canvas.classList.add('panning');S.view.x=g.vx+dx;S.view.y=g.vy+dy;applyView()}
  else if(g.type==='marquee'){
    const cr=canvas.getBoundingClientRect(),v=S.view,m=$('#marquee');
    const x0=Math.min(g.sx,e.clientX)-cr.left,y0=Math.min(g.sy,e.clientY)-cr.top,x1=Math.max(g.sx,e.clientX)-cr.left,y1=Math.max(g.sy,e.clientY)-cr.top;
    Object.assign(m.style,{left:x0+'px',top:y0+'px',width:(x1-x0)+'px',height:(y1-y0)+'px'});m.hidden=false;
    const wx0=(x0-v.x)/v.k,wy0=(y0-v.y)/v.k,wx1=(x1-v.x)/v.k,wy1=(y1-v.y)/v.k;
    g.hits=new Set(g.base);
    for(const id in elMap){const r=rectOf(id);if(r.x<wx1&&r.x+r.w>wx0&&r.y<wy1&&r.y+r.h>wy0)g.hits.add(id)}
    for(const id in elMap)elMap[id].classList.toggle('sel',g.hits.has(id));
  }
  else if(g.type==='link'){
    // dashed line from the box to the pointer; highlight the box underneath
    const cr=canvas.getBoundingClientRect(),v=S.view;
    const px=(e.clientX-cr.left-v.x)/v.k,py=(e.clientY-cr.top-v.y)/v.k;
    guidesEl.innerHTML=`<path class="linkline" stroke-width="${2/v.k}" d="${g.ids.map(i=>{const r=rectOf(i);return `M${r.x+r.w/2},${r.y+r.h/2}L${px},${py}`}).join('')}"/>`;
    const under=document.elementFromPoint(e.clientX,e.clientY),ne=under&&under.closest('.node'),over=ne&&!g.ids.includes(ne.dataset.id)?ne.dataset.id:null;
    if(over!==g.over){if(g.over&&elMap[g.over])elMap[g.over].classList.remove('droptarget');if(over)elMap[over].classList.add('droptarget');g.over=over}
  }
  else if(g.type==='resize'){
    const k=S.view.k,n=N(g.id),el=elMap[g.id];if(!n||!el)return;
    let w=Math.max(60,g.ow+dx/k),h=Math.max(20,g.oh+dy/k),segs=[];
    if(!e.altKey){  // snap the right and bottom edges to other cards' edges and centres
      if(!g.snap)g.snap=snapPrep(new Set([g.id,...g.group.map(o=>o.id),...g.fp.plan.keys()]),g.id);
      const T=7/k,near=(v,list)=>{let b=null;for(const a of list)if(Math.abs(a-v)<=T&&(b===null||Math.abs(a-v)<Math.abs(b-v)))b=a;return b};
      const xs=g.snap.refs.flatMap(f=>[f.x,f.x+f.w/2,f.x+f.w]),ys=g.snap.refs.flatMap(f=>[f.y,f.y+f.h/2,f.y+f.h]);
      const bx=near(n.x+w,xs),by=near(n.y+h,ys);
      if(bx!==null&&bx-n.x>=60){w=bx-n.x;const hit=g.snap.refs.filter(f=>[f.x,f.x+f.w/2,f.x+f.w].some(v=>Math.abs(v-bx)<.6)),yy=[n.y,n.y+h,...hit.flatMap(f=>[f.y,f.y+f.h])];segs.push([bx,Math.min(...yy)-8,bx,Math.max(...yy)+8])}
      if(by!==null&&by-n.y>=20){h=by-n.y;const hit=g.snap.refs.filter(f=>[f.y,f.y+f.h/2,f.y+f.h].some(v=>Math.abs(v-by)<.6)),xx=[n.x,n.x+w,...hit.flatMap(f=>[f.x,f.x+f.w])];segs.push([Math.min(...xx)-8,by,Math.max(...xx)+8,by])}
    }
    n.w=Math.round(w);if(Math.abs(dy)>2||n.h)n.h=Math.round(h);
    el.style.width=n.w+'px';el.style.maxWidth='none';if(n.h)el.style.minHeight=n.h+'px';
    const dw=w-g.ow,dh=h-g.oh;
    for(const o of g.group){const m=N(o.id),me=elMap[o.id];if(!m||!me)continue;
      m.w=Math.round(Math.max(60,o.ow+dw));if(Math.abs(dy)>2||m.h)m.h=Math.round(Math.max(20,o.oh+dh));
      me.style.width=m.w+'px';me.style.maxWidth='none';if(m.h)me.style.minHeight=m.h+'px'}
    // resized boxes in the same row push each other right, and in the same column push each other down
    if(g.srcs.length>1){
      const grow=Object.fromEntries(g.srcs.map(o=>[o.id,[elMap[o.id].offsetWidth-o.ow,elMap[o.id].offsetHeight-o.oh]]));
      for(const S of g.srcs){let sx=0,sy=0;
        for(const T of g.srcs){if(T===S)continue;
          if(T.oy<S.oy+S.oh&&S.oy<T.oy+T.oh&&T.ox<S.ox)sx+=grow[T.id][0];
          else if(T.ox<S.ox+S.ow&&S.ox<T.ox+T.ow&&T.oy<S.oy)sy+=grow[T.id][1]}
        const m=N(S.id);m.x=Math.round(S.ox+sx);m.y=Math.round(S.oy+sy);elMap[S.id].style.left=m.x+'px';elMap[S.id].style.top=m.y+'px'}
    }
    applyFollow(g.fp);
    drawGuides(segs);drawEdges();
  }
  else if(g.type==='drag'){
    const k=S.view.k;let mx=dx/k,my=dy/k,segs=[];
    if(!e.altKey){
      if(!g.snap)g.snap=snapPrep(new Set(g.orig.map(o=>o[0])),g.id);
      const p=g.snap,T=7/k,r={...p.me,x:p.me.x+mx,y:p.me.y+my};

    }
    drawGuides(segs);
    for(const [i,ox,oy] of g.orig){const n=N(i);n.x=Math.round(ox+mx);n.y=Math.round(oy+my);const el=elMap[i];if(el){el.style.left=n.x+'px';el.style.top=n.y+'px'}}
    drawEdges();
  }
});
function endPointer(e){
  if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);drawGuides([]);
  if(!g)return;
  if(g.type==='pinch'){if(pts.size===0)g=null;else g={type:'none'};save();return}
  if(g.type==='attach'){doAttach(g.id)}
  else if(g.type==='resize'){if(g.moved){delete N(g.id)._new;g.srcs.forEach(o=>updateSide(o.id));render();renderPanel();save()}}
  else if(g.type==='link'){
    if(g.over&&elMap[g.over])elMap[g.over].classList.remove('droptarget');
    attachFrom=g.ids.length>1?g.ids:g.id;
    if(!g.moved){canvas.classList.add('attaching');toast(g.ids.length>1?`Tap the box to link these ${g.ids.length} under, or empty space to cancel`:'Tap the box to link it under, or empty space to cancel')}
    else if(!g.over){attachFrom=null;toast('Drop onto a box to link')}
    else doAttach(g.over);
  }
  else if(g.type==='drag'){
    if(g.moved){for(const b of g.base){updateSide(b);if(moveMode==='card')kids(b).forEach(k=>updateSide(k.id))}drawEdges();save()}
    const id=g.id;
    if(g.shift&&!g.moved){toggleMulti(id);lastTap={};g=null;return}
    if(g.moved&&msel.has(id)){g=null;return}
    const now=Date.now(),dbl=!g.moved&&lastTap.id===id&&now-lastTap.t<400;
    lastTap=g.moved||dbl?{}:{id,t:now};
    if(sel!==id)select(id);else if(!g.moved)renderPanel();
    if(dbl)startEdit(id);
  }
  else if(g.type==='pan'){canvas.classList.remove('panning');if(g.moved)save();else if(attachFrom)doAttach(null);else if(sel||msel.size)deselect()}
  else if(g.type==='marquee'){
    $('#marquee').hidden=true;
    if(!g.moved){if(sel||msel.size)deselect()}
    else{
      const hits=[...(g.hits||[])];
      if(!hits.length)deselect();
      else if(hits.length===1)select(hits[0]);
      else{if(sel&&isEmpty(N(sel)))delete S.nodes[sel];sel=null;msel=new Set(hits);closeDue();render();renderPanel()}
    }
  }
  g=null;
}
canvas.addEventListener('pointerup',endPointer);

function updateBadge(){
  const c=all().filter(n=>!n.done&&dueInfo(n.due)&&dueInfo(n.due).cls!=='later').length;
  const b=$('#dueBadge');b.hidden=!c;b.textContent=c;
}
function closeDue(){duelist.hidden=true}
function renderDue(){
  const rows=all().filter(n=>!n.done&&dueInfo(n.due)).map(n=>({n,d:dueInfo(n.due)})).sort((a,b)=>a.d.t-b.d.t);
  const grp=(name,list)=>list.length?`<div class="grp"><h3>${name}</h3>${list.map(({n,d})=>`<button class="drow ${d.cls}" data-go="${n.id}" style="--c:${colorOf(n.id)||'var(--muted)'}"><span class="t">${esc(n.title||'Untitled')}</span><span class="d">${esc(d.label)}</span></button>`).join('')}</div>`:'';
  const over=rows.filter(r=>r.d.cls==='over'),today=rows.filter(r=>r.d.cls==='today'),later=rows.filter(r=>r.d.cls==='later');
  duelist.innerHTML=`<div class="top"><span>Due dates</span><button class="x" data-close aria-label="Close">×</button></div>
  <div class="body">${rows.length?grp('Overdue',over)+grp('Today',today)+grp('Coming up',later):'<p class="hint" style="margin:0">Nothing has a due date yet. Select a task and set one in its panel.</p>'}
  <p class="hint" style="margin:0">Reminders pop up here while this page is open. Tasks are only checked when the page is running.</p></div>`;
}

  if(e.target.closest('[data-close]')){closeDue();return}
  const r=e.target.closest('[data-go]');if(!r)return;const id=r.dataset.go;
  closeDue();const n=N(id),rect=canvas.getBoundingClientRect(),el=elMap[id],v=S.view;
  const w=el?el.offsetWidth:200,h=el?el.offsetHeight:40,cx=rect.width<720?rect.width/2:(rect.width-360)/2;
  v.x=cx-(n.x+w/2)*v.k;v.y=(rect.width<720?rect.height*.25:rect.height/2)-(n.y+h/2)*v.k;applyView();save();select(id);
});

/* ---------- reminders while open ---------- */
function checkReminders(){
  const now=Date.now();
  for(const n of all()){
    if(n.done||!n.due||n.alerted===n.due)continue;const d=dueInfo(n.due);if(!d)continue;
    const due=d.hasTime?d.t.getTime():d.t.getTime()+9*36e5;
    if(due<=now){n.alerted=n.due;save();if(now-due<15*60e3)toast(`Due now: ${n.title||'Untitled'}`,'Show',()=>{select(n.id)})}
  }
  updateBadge();
}

/* ---------- sync (Firebase: one Firestore doc per card under users/{uid}/nodes) ---------- */
const FB='https://www.gstatic.com/firebasejs/12.19.0/';
const SYNC_UID='branches.syncUid',PRESYNC='branches.presync';
let fb=null,db=null,user=null,unsub=null,firstSnap=true,synced={},pushT=null;
const canon=v=>Array.isArray(v)?'['+v.map(canon).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}':JSON.stringify(v??null);
const clean=n=>{const o={...n};delete o._new;return o};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function setSync(st){
  const lbl={off:'Sync',loading:'Connecting…',ok:'Synced',saving:'Saving…',offline:'Offline',error:'Sync error'}[st];
  $('#syncDot').className='sdot '+st;$('#syncLbl').textContent=lbl;
}
function renderSyncBox(){
  $('#syncSec').hidden=!FIREBASE_CONFIG;if(!FIREBASE_CONFIG)return;
  $('#syncBox').innerHTML=user
    ?`<p class="hint" style="margin:0">Signed in as <b>${esc(user.email||user.displayName||'you')}</b>. Changes appear on every device where you're signed in.</p><div class="row"><button class="btn" id="bSignOut" style="border:1px solid var(--line)">Sign out on this device</button></div>`
    :`<p class="hint" style="margin:0">Sign in with Google to keep this board in step across your laptop and phone.</p><div class="row"><button class="btn primary" id="bSignIn">Sign in with Google</button></div>`;
  $('#presyncBox').hidden=!(user&&lsGet(PRESYNC));
}
function queuePush(){if(!user||firstSnap)return;clearTimeout(pushT);pushT=setTimeout(push,400)}
function push(){
  clearTimeout(pushT);if(!user||firstSnap)return;
  const ops=[];
  for(const n of all()){if(isEmpty(n))continue;const c=clean(n),s=canon(c);if(synced[n.id]!==s){ops.push([n.id,c]);synced[n.id]=s}}
  for(const id in synced)if(!S.nodes[id]){ops.push([id,null]);delete synced[id]}
  for(let i=0;i<ops.length;i+=400){
    const b=fb.writeBatch(db);
    for(const [id,d] of ops.slice(i,i+400)){const r=fb.doc(db,'users',user.uid,'nodes',id);d?b.set(r,d):b.delete(r)}
    b.commit().catch(e=>{console.error(e);setSync('error')});
  }
}
function onRemote(snap){
  const m=snap.metadata;
  if(firstSnap){
    if(m.fromCache&&snap.empty)return;           // wait for the server before deciding anything
    firstSnap=false;
    const remote={};snap.forEach(d=>remote[d.id]={...d.data(),id:d.id});
    const known=lsGet(SYNC_UID)===user.uid;lsSet(SYNC_UID,user.uid);
    if(snap.empty&&!known){synced={};push();toast('Signed in. This board now syncs to your other devices.')}
    else{
      const mine=all().filter(n=>!isEmpty(n));
      if(!known&&mine.length&&canon(Object.fromEntries(mine.map(n=>[n.id,clean(n)])))!==canon(remote)){
        lsSet(PRESYNC,JSON.stringify(S.nodes));toast('Loaded your synced board. This device’s old board was kept aside.','Details',openModal);
      }else if(!known)toast('Signed in. Your synced board is loaded.');
      checkpoint();S.nodes=remote;synced={};for(const id in remote)synced[id]=canon(remote[id]);
      if(sel&&!N(sel)){sel=null;closePanel()}
      renderQuiet();if(!known)fit();save();nextLabel='Loaded your synced board';checkpoint();
    }
  }else{
    let changed=false;checkpoint();
    for(const c of snap.docChanges()){
      const id=c.doc.id;
      if(c.type==='removed'){delete synced[id];if(S.nodes[id]){delete S.nodes[id];changed=true;if(sel===id){sel=null;closePanel()}}continue}
      if(c.doc.metadata.hasPendingWrites)continue;   // our own write coming back
      const d={...c.doc.data(),id},s=canon(d),local=N(id);
      const pending=local&&synced[id]!==undefined&&canon(clean(local))!==synced[id];
      synced[id]=s;
      if(pending||(local&&canon(clean(local))===s))continue;  // unsent local edit wins; identical needs nothing
      S.nodes[id]=d;changed=true;
    }
    if(changed){renderQuiet();if(sel&&!panel.contains(document.activeElement))renderPanel();save();nextLabel='Changes from another device';checkpoint()}
  }
  setSync(m.hasPendingWrites?'saving':m.fromCache?'offline':'ok');
  renderSyncBox();
}
async function initSync(){
  if(!FIREBASE_CONFIG)return;
  $('#bSync').hidden=false;setSync('loading');
  try{
    const [app,auth,fs]=await Promise.all(['app','auth','firestore'].map(x=>import(FB+'firebase-'+x+'.js')));
    fb={...auth,...fs};
    const a=app.initializeApp(FIREBASE_CONFIG);
    fb.au=auth.getAuth(a);
    db=fs.initializeFirestore(a,{ignoreUndefinedProperties:true,localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})});
    auth.onAuthStateChanged(fb.au,u=>{
      if(unsub){unsub();unsub=null}
      user=u;firstSnap=true;synced={};
      if(!u){setSync('off');renderSyncBox();return}
      setSync('loading');renderSyncBox();
      unsub=fs.onSnapshot(fs.collection(db,'users',u.uid,'nodes'),{includeMetadataChanges:true},onRemote,e=>{console.error(e);setSync('error');toast('Sync stopped: '+(e.code||e.message))});
    });
  }catch(e){console.error(e);setSync('error')}
}
$('#bSync').onclick=()=>{if(!fb)return;if(!user)signIn();else openModal()};
function signIn(){
  fb.signInWithPopup(fb.au,new fb.GoogleAuthProvider()).catch(e=>{if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')toast('Sign-in failed: '+(e.code||e.message))});
}
$('#modal').addEventListener('click',e=>{
  if(e.target.id==='bSignIn')signIn();
  else if(e.target.id==='bSignOut'){push();fb.signOut(fb.au);lsSet(SYNC_UID,null);toast('Signed out. The board stays on this device but no longer syncs.')}
  else if(e.target.id==='bkPresync'){
    try{S.nodes=JSON.parse(lsGet(PRESYNC));lsSet(PRESYNC,null);sel=null;closePanel();render();fit();save();$('#modal').hidden=true;
      nextLabel='Replaced board with this device’s old one';checkpoint();toast('Board replaced','Undo',undo)}catch(_){}
  }
  else if(e.target.id==='bkPresyncDrop'){lsSet(PRESYNC,null);renderSyncBox()}
});

function isolate(id){

  reveal(id);focusStack.push(id);render();if(sel)renderPanel();requestAnimationFrame(fit);

function exitFocus(level){

function renderFocusBar(){

    focusStack.map((id,i)=>`<span style="color:var(--muted)">›</span><button class="crumb${i===focusStack.length-1?' cur':''}" data-lvl="${i+1}">${esc((N(id).title||'Untitled').slice(0,28))}</button>`).join('')+
    `<button class="btn" data-lvl="0">Show everything</button>`;

$('#focusbar').addEventListener('click',e=>{const b=e.target.closest('[data-lvl]');if(!b)return;const l=+b.dataset.lvl;if(l!==focusStack.length)exitFocus(l)});

/* ---------- views: Branches (board) · Tasks (list by date) · Calendar (day/week/month/year) ---------- */
const listEl=$('#listview'),calEl=$('#calview');
const pad2=v=>String(v).padStart(2,'0');
const dayKey=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const fmt=(d,o)=>d.toLocaleDateString(undefined,o);
let calMode=lsGet('branches.calMode')||'month',calDate=new Date();
function setView(v){
  if(!['branches','tasks','calendar'].includes(v))v='branches';
  view=v;lsSet('branches.view',v);document.body.dataset.view=v;

}
$('#viewSeg').onclick=e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)};
function renderView(){if(view==='tasks')renderTasks();else if(view==='calendar')renderCal()}
function pathOf(n){const p=[];let c=n.parent&&N(n.parent),g=0;while(c&&g++<50){p.unshift(c.title||'Untitled');c=c.parent&&N(c.parent)}return p.join(' › ')}

// jump from a list/calendar item to its box on the board
function showOnBoard(id){
  reveal(id);setView('branches');
  const n=N(id),el=elMap[id],r=canvas.getBoundingClientRect(),v=S.view,w=el?el.offsetWidth:200,h=el?el.offsetHeight:40;
  const cx=r.width<720?r.width/2:(r.width-360)/2;v.x=cx-(n.x+w/2)*v.k;v.y=(r.width<720?r.height*.3:r.height/2)-(n.y+h/2)*v.k;applyView();save();select(id);

/* Tasks */
let showDone=false;
function renderTasks(){
  const tasks=all().filter(isTask),open=tasks.filter(n=>!n.done),done=tasks.filter(n=>n.done);
  const now=new Date(),tod=dayKey(now),tom=dayKey(addDays(now,1));
  const groups=new Map(),add=(k,label,cls,n)=>{if(!groups.has(k))groups.set(k,{label,cls,items:[]});groups.get(k).items.push(n)};
  const dated=open.filter(n=>dueInfo(n.due)).sort((a,b)=>dueInfo(a.due).t-dueInfo(b.due).t);
  for(const n of dated){
    const di=dueInfo(n.due),k=dayKey(di.t);
    if(di.cls==='over')add('0over','Overdue','over',n);
    else add(k,(k===tod?'Today · ':k===tom?'Tomorrow · ':'')+fmt(di.t,{weekday:'long',day:'numeric',month:'long',...(di.t.getFullYear()!==now.getFullYear()?{year:'numeric'}:{})}),'',n);
  }
  for(const n of open.filter(n=>!dueInfo(n.due)))add('~none','No date','',n);
  const row=n=>{
    const di=dueInfo(n.due),path=pathOf(n),it=(n.items||[]).length?`${n.items.filter(i=>i.done).length}/${n.items.length} items`:'';
    const when=di?(di.cls==='over'||!di.hasTime?(di.cls==='over'?di.label:''):di.t.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})):'';
    const sub=[n.repeat?'↻ '+repeatText(n.repeat):'',n.notify&&(n.notify.to||[]).length?'✉ '+notifyText(n):'',path,it].filter(Boolean).join(' · ');
    return `<div class="trow${n.color?' filled':''}${n.done?' done':''}${sel===n.id?' sel':''}" data-id="${n.id}" style="--c:${boxColor(n)};${n.color?`--on:${onColor(n.color)}`:''}">
      <button class="tchk" data-act="tdone" aria-label="${n.done?'Mark not done':'Mark done'}"></button>
      <div class="tm"><div class="tt">${esc(n.title||'Untitled')}</div>${sub?`<div class="ts">${esc(sub)}</div>`:''}</div>
      ${when?`<span class="tw ${di.cls}">${esc(when)}</span>`:''}
      <button class="tgo" data-act="tgo" title="Show on the board" aria-label="Show on the board">↗</button></div>`;
  };
  const keys=[...groups.keys()].sort();
  let html=keys.map(k=>{const g=groups.get(k);return `<div class="tgrp"><h3 class="${g.cls}">${esc(g.label)} <span style="font-weight:400">· ${g.items.length}</span></h3>${g.items.map(row).join('')}</div>`}).join('');
  if(done.length)html+=`<div class="tgrp"><button class="tdone" data-act="tshowdone">${showDone?'▾':'▸'} Done · ${done.length}</button>${showDone?done.map(row).join(''):''}</div>`;
  if(!tasks.length)html=`<div class="tempty">No tasks yet.<br><span style="font-size:14px">Open a box and switch on “It’s a task”, or press New box here to add one.</span></div>`;
  listEl.innerHTML=`<div class="tl">${html}</div>`;
}
listEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'),r=e.target.closest('.trow');
  if(b&&b.dataset.act==='tshowdone'){showDone=!showDone;renderTasks();return}
  if(!r){if(sel||msel.size)deselect();return}
  const id=r.dataset.id,n=N(id);if(!n)return;
  if(b&&b.dataset.act==='tdone'){toggleDone(n);n.task=true;render();if(sel===id)renderPanel();save();return}
  if(b&&b.dataset.act==='tgo'){showOnBoard(id);return}
  select(id);
});

/* Calendar */
function dueByDay(until){
  const m=new Map(),put=(k,x)=>{if(!m.has(k))m.set(k,[]);m.get(k).push(x)};
  for(const n of all()){
    const di=dueInfo(n.due);if(!di)continue;put(dayKey(di.t),{n,di});
    // upcoming repeats, shown faded
    if(n.repeat&&!n.done&&until){let cur={...n},g=0;
      while(g++<400){const nd=nextDue(cur,true);if(!nd)break;const t=parseDue(nd);if(t>=until)break;put(dayKey(t),{n,di:dueInfo(nd),ghost:true});cur={...cur,due:nd}}}
  }
  for(const l of m.values())l.sort((a,b)=>(a.di.hasTime?a.di.t:-1)-(b.di.hasTime?b.di.t:-1));
  return m;
}
function chip(n,di,style='',ghost){
  const c=n.color,time=di.hasTime?di.t.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}):'';
  const colours=c?`--chipbg:${c};--chipfg:${onColor(c)};`:'';
  return `<button class="chip${n.done?' done':''}${ghost?' ghost':''}${sel===n.id?' sel':''}" data-id="${n.id}" style="--c:${boxColor(n)};${colours}${style}" title="${esc(n.title||'Untitled')}">${time?`<span class="tm">${esc(time)}</span>`:''}${esc(n.title||'Untitled')}</button>`;
}
const HH=44;  // pixels per hour in day/week view
function renderCal(){
  const d=calDate,by=dueByDay(calMode==='year'?new Date(d.getFullYear()+1,0,1):new Date(d.getFullYear(),d.getMonth()+2,8)),today=dayKey(new Date());
  let title='',body='';
  const wd=i=>fmt(addDays(new Date(2024,0,1),i),{weekday:'short'});  // 1 Jan 2024 was a Monday
  if(calMode==='month'){
    title=fmt(d,{month:'long',year:'numeric'});
    const first=new Date(d.getFullYear(),d.getMonth(),1),start=mondayOf(first);
    let cells='';
    for(let i=0;i<42;i++){
      const day=addDays(start,i),k=dayKey(day),items=by.get(k)||[],max=3;
      cells+=`<div class="mcell${day.getMonth()!==d.getMonth()?' dim':''}${k===today?' today':''}" data-day="${k}"><button class="dn" data-goday="${k}">${day.getDate()}</button>${items.slice(0,max).map(x=>chip(x.n,x.di,'',x.ghost)).join('')}${items.length>max?`<button class="more" data-goday="${k}">+${items.length-max} more</button>`:''}</div>`;
    }
    body=`<div class="mgrid">${[0,1,2,3,4,5,6].map(i=>`<div class="dh">${wd(i)}</div>`).join('')}${cells}</div>`;
  }else if(calMode==='week'||calMode==='day'){
    const days=calMode==='week'?[0,1,2,3,4,5,6].map(i=>addDays(mondayOf(d),i)):[d];
    if(calMode==='week'){const a=days[0],b=days[6];title=`${fmt(a,{day:'numeric',month:'short'})} – ${fmt(b,{day:'numeric',month:'short',year:'numeric'})}`}
    else title=fmt(d,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const head=days.map(day=>`<div class="${dayKey(day)===today?'today':''}">${fmt(day,{weekday:'short'})}<button class="dn" data-goday="${dayKey(day)}">${day.getDate()}</button></div>`).join('');
    const allday=days.map(day=>`<div data-day="${dayKey(day)}">${(by.get(dayKey(day))||[]).filter(x=>!x.di.hasTime).map(x=>chip(x.n,x.di,'',x.ghost)).join('')}</div>`).join('');
    const hours=[...Array(24)].map((_,h)=>h?`<span style="top:${h*HH}px">${pad2(h)}:00</span>`:'').join('');
    const now=new Date(),nowTop=(now.getHours()+now.getMinutes()/60)*HH;
    const cols=days.map(day=>{
      const timed=(by.get(dayKey(day))||[]).filter(x=>x.di.hasTime);
      // items starting within an hour of each other share the width side by side
      const placed=[];let cluster=[];
      const flush=()=>{cluster.forEach((x,i)=>placed.push({...x,lane:i,lanes:cluster.length}));cluster=[]};
      for(const x of timed){if(cluster.length&&x.di.t-cluster[cluster.length-1].di.t>=36e5)flush();cluster.push(x)}flush();
      const chips=placed.map(x=>{const top=(x.di.t.getHours()+x.di.t.getMinutes()/60)*HH;return chip(x.n,x.di,`top:${top}px;height:${HH-4}px;left:calc(${x.lane*100/x.lanes}% + 2px);width:calc(${100/x.lanes}% - 4px);`,x.ghost)}).join('');
      return `<div class="dcol${dayKey(day)===today?' today':''}" data-day="${dayKey(day)}" data-timed="1">${dayKey(day)===today?`<div class="nowline" style="top:${nowTop}px"></div>`:''}${chips}</div>`;
    }).join('');
    body=`<div class="tgwrap" style="--cols:${days.length};--hh:${HH}px">
      <div class="tghead"><div class="lbl"></div>${head}</div>
      <div class="tgall"><div class="lbl">All day</div>${allday}</div>
      <div class="tgscroll" id="tgscroll"><div class="tgbody"><div class="tghours">${hours}</div>${cols}</div></div></div>`;
  }else{
    title=String(d.getFullYear());
    body=`<div class="ycal">${[...Array(12)].map((_,m)=>{
      const first=new Date(d.getFullYear(),m,1),start=mondayOf(first);let g=[0,1,2,3,4,5,6].map(i=>`<span class="h">${wd(i).slice(0,1)}</span>`).join('');
      for(let i=0;i<42;i++){const day=addDays(start,i),k=dayKey(day);g+=day.getMonth()!==m?'<span></span>':`<button class="${by.has(k)?'has':''}${k===today?' today':''}" data-goday="${k}" title="${by.has(k)?by.get(k).length+' item(s)':''}">${day.getDate()}</button>`}
      return `<div class="ymon"><h4><button class="dn" style="font-size:14px;padding:0" data-gomonth="${m}">${fmt(first,{month:'long'})}</button></h4><div class="yg">${g}</div></div>`;
    }).join('')}</div>`;
  }
  const keepScroll=calEl.scrollTop,ts=$('#tgscroll'),keepTg=ts?ts.scrollTop:null;
  calEl.innerHTML=`<div class="calbar">
      <div class="seg" id="calSeg">${['day','week','month','year'].map(m=>`<button data-mode="${m}" class="${calMode===m?'on':''}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>
      <div class="nav"><button class="btn" data-nav="-1" aria-label="Previous">‹</button><button class="btn" data-nav="0">Today</button><button class="btn" data-nav="1" aria-label="Next">›</button></div>
      <h2>${esc(title)}</h2></div><div class="cal">${body}</div>`;
  calEl.scrollTop=keepScroll;const ts2=$('#tgscroll');if(ts2&&keepTg!==null)ts2.scrollTop=keepTg;
}
function scrollCalToMorning(){const b=$('#tgscroll');if(b)b.scrollTop=7*HH-8}
function calGo(mode,date){calMode=mode;lsSet('branches.calMode',mode);if(date)calDate=date;calEl.scrollTop=0;renderCal();scrollCalToMorning()}
const keyToDate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
calEl.addEventListener('click',e=>{
  const t=e.target;
  const md=t.closest('[data-mode]');if(md){calGo(md.dataset.mode);return}
  const nv=t.closest('[data-nav]');if(nv){
    const s=+nv.dataset.nav,d=calDate;
    calDate=!s?new Date():calMode==='day'?addDays(d,s):calMode==='week'?addDays(d,7*s):calMode==='month'?new Date(d.getFullYear(),d.getMonth()+s,1):new Date(d.getFullYear()+s,d.getMonth(),1);
    renderCal();if(!s)scrollCalToMorning();return}
  const gd=t.closest('[data-goday]');if(gd){calGo('day',keyToDate(gd.dataset.goday));return}
